name: Isolated event anchor baseline 20261021
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HKUDS/Vibe-Trading
          ref: 350ebb5c69b11f2334f9b86e194239931a77c766
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Frozen source guard
        run: |
          test "$(git rev-parse HEAD)" = 350ebb5c69b11f2334f9b86e194239931a77c766
          test "$(git rev-parse HEAD^{tree})" = 5c4d2d784b946ae1ae572a91f36d4c32f7294c7c
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Supported scientific dependencies only
        run: |
          mkdir -p /tmp/vibe-native-artifacts
          python -m pip install --only-binary=:all: --disable-pip-version-check --report /tmp/vibe-native-artifacts/pip-report.json numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
          python -m pip check
          python -m pip freeze > /tmp/vibe-native-artifacts/pip-freeze.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" > /tmp/vibe-native-artifacts/image.txt
      - name: Actual isolated production toolchain and exact label oracle
        run: |
          python -c "import base64,pathlib;pathlib.Path('/tmp/native-event-baseline.py').write_bytes(base64.b64decode(''))"
          echo '5901a88b4e673c743efc02367774bfc9d1d133c86975f6926f18cc115e00f5d2  /tmp/native-event-baseline.py' | sha256sum --check
          PYTHONWARNINGS=error python /tmp/native-event-baseline.py > /tmp/vibe-native-artifacts/baseline.log 2>&1
      - name: Always final source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = 350ebb5c69b11f2334f9b86e194239931a77c766
          test "$(git rev-parse HEAD^{tree})" = 5c4d2d784b946ae1ae572a91f36d4c32f7294c7c
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibe-event-native-baseline
          path: /tmp/vibe-native-artifacts
          retention-days: 30
