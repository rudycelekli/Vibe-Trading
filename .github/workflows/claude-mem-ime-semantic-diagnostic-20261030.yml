{
  "name": "Claude-mem IME unchanged semantic-filter baseline diagnostic",
  "on": {
    "push": {
      "branches": [
        "validation/additional20-ime-semantic-diagnostic-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "claude-mem-additional20-ime-semantic-diagnostic-20261030",
    "cancel-in-progress": false
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "jobs": {
    "diagnostic": {
      "name": "Read-only same-file canonical and candidate comparison",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "if": "github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/additional20-ime-semantic-diagnostic-20261030'",
      "steps": [
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "20.19.0"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.2"
          }
        },
        {
          "name": "Fetch immutable public source and install proof driver",
          "run": "set -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nmkdir -p \"$TASK_DIR/evidence\" \"$TASK_DIR/input\"\ncat > \"$TASK_DIR/qualification.py\" <<'PY_QUALIFICATION'\nimport pathlib, subprocess, json, hashlib, base64, sys, os, tempfile, xml.etree.ElementTree as ET\nCFG = {'base': '325afb60108d4ab04e24d715f244bd591ca33fbe', 'tree': '2bc013a50679c7a4cf936d8446a981c713daff1f', 'patch_sha': '7052b0b10035669c1a930f14dbdc9cce5d119a8c657ed39197dd055ddab72efa', 'patch_b64': '', 'file_hashes': {'src/ui/viewer/components/ContextSettingsModal.tsx': 'cdd6dd6fc26b67c9ab1d7614d7202fc2971f4b3b1e19a551340a5dd6d6556d5e', 'tests/ui/viewer/settings-ime-escape.browser.test.ts': 'd8c58e7706b6a5bdc1a97f154e9fbb1d436da7fc8009d6ba4e428dbd4cbcca82'}, 'all_names': ['keeps the settings draft open for an IME Escape but closes for an ordinary Escape'], 'fail_names': ['keeps the settings draft open for an IME Escape but closes for an ordinary Escape'], 'test_path': 'tests/ui/viewer/settings-ime-escape.browser.test.ts', 'consumer_files': ['tests/ui/viewer/settings-save-draft.browser.test.ts'], 'production_paths': ['src/ui/viewer/components/ContextSettingsModal.tsx'], 'baseline_hashes': {'src/ui/viewer/components/ContextSettingsModal.tsx': 'eb2e0307563b7415e57bb881f060a3889d5dbd1cd57a3cd5fda4d98c673b9550'}, 'consumer_names': ['keeps the settings draft open for an IME Escape but closes for an ordinary Escape', 'protects the settings draft while an actual failed save is pending', 'protects the settings draft while an actual successful save is pending']}\nTASK = pathlib.Path(os.environ['RUNNER_TEMP']) / 'claude-mem-qualification'\nSRC = TASK / 'source'\nEVIDENCE = TASK / 'evidence'\nINPUT = TASK / 'input'\nEVIDENCE.mkdir(parents=True, exist_ok=True)\nINPUT.mkdir(parents=True, exist_ok=True)\nOWNED = set(CFG['file_hashes'])\nGENERATED_PREFIXES = ('plugin/scripts/', 'plugin/sqlite/', 'plugin/ui/')\nGENERATED_FILES = {\n 'plugin/skills/request-progress/scripts/request-groups.mjs',\n 'plugin/package.json','plugin/bun.lock','dsh/package.json',\n '.codex-plugin/plugin.json','plugin/.codex-plugin/plugin.json',\n '.qoder-plugin/plugin.json','plugin/.qoder-plugin/plugin.json',\n '.claude-plugin/plugin.json','plugin/.claude-plugin/plugin.json',\n '.claude-plugin/marketplace.json','.grok-plugin/plugin.json',\n 'openclaw/openclaw.plugin.json',\n 'claude-mem-cursor/.cursor-plugin/plugin.json',\n 'claude-mem-grok-bot/.cursor-plugin/plugin.json',\n 'plugin/skills/how-it-works/onboarding-explainer.md',\n}\ndef sha(p):\n return hashlib.sha256(p.read_bytes()).hexdigest()\ndef call(args, **kwargs):\n return subprocess.run(args, cwd=SRC, check=True, capture_output=True, text=True, **kwargs).stdout.strip()\ndef write(name, value):\n (EVIDENCE/name).write_text(json.dumps(value,indent=2)+'\\n')\ndef generated(name):\n return name in GENERATED_FILES or name.startswith(GENERATED_PREFIXES)\ndef tracked():\n names=call(['git','ls-files','-z']).split('\\0')\n result={}\n for name in names:\n  if not name: continue\n  p=SRC/name\n  result[name]=hashlib.sha256(os.readlink(p).encode()).hexdigest() if p.is_symlink() else sha(p)\n return result\ndef tree():\n with tempfile.TemporaryDirectory(prefix='index-',dir=TASK) as td:\n  env=dict(os.environ,GIT_INDEX_FILE=str(pathlib.Path(td)/'index'))\n  call(['git','read-tree','HEAD'],env=env)\n  call(['git','add','--',*sorted(OWNED)],env=env)\n  return call(['git','write-tree'],env=env)\ndef assert_base():\n assert call(['git','rev-parse','HEAD'])==CFG['base'], 'immutable source HEAD changed'\ndef initialize():\n assert_base()\n assert not call(['git','status','--porcelain','--untracked-files=no']), 'base must be tracked-clean'\n assert not (SRC/'package-lock.json').exists(), 'repo intentionally has no root lockfile'\n for name,digest in CFG['baseline_hashes'].items(): assert sha(SRC/name)==digest,name\n data=base64.b64decode(CFG['patch_b64'],validate=True)\n assert hashlib.sha256(data).hexdigest()==CFG['patch_sha']\n (INPUT/'candidate.patch').write_bytes(data)\n chunks=[b'diff --git '+x for x in data.split(b'diff --git ')[1:]]\n assert len(chunks)==2\n expected={('diff --git a/'+name+' b/'+name).encode():('tests.patch' if name==CFG['test_path'] else 'production.patch') for name in CFG['file_hashes']}\n grouped={'tests.patch':[],'production.patch':[]}\n for chunk in chunks:\n  first=chunk.splitlines()[0]\n  assert first in expected,first\n  grouped[expected[first]].append(chunk)\n assert len(grouped['tests.patch'])==1 and len(grouped['production.patch'])==1\n for name,parts in grouped.items(): (INPUT/name).write_bytes(b''.join(parts))\n write('base-tracked.json',tracked())\n write('input-provenance.json',{'base':CFG['base'],'candidate_tree':CFG['tree'],'patch_sha256':CFG['patch_sha'],'patch_parts':{p.name:sha(p) for p in INPUT.glob('*.patch')}})\n\ndef install_guard():\n assert_base()\n before=json.loads((EVIDENCE/'base-tracked.json').read_text())\n assert tracked()==before, 'dependency installation changed tracked source'\ndef check_junit(path, mode):\n doc=ET.parse(path)\n cases=list(doc.iter('testcase'))\n failures=[c for c in cases if c.find('failure') is not None]\n errors=[c for c in cases if c.find('error') is not None]\n skips=[c for c in cases if c.find('skipped') is not None]\n expected=3 if mode=='consumers' else 1\n assert len(cases)==expected, (len(cases),expected)\n assert not errors and not skips, 'native proof cannot be an error or skip'\n if mode=='before':\n  assert sorted(c.attrib['name'] for c in cases)==CFG['all_names']\n  assert sorted(c.attrib['name'] for c in failures)==CFG['fail_names']\n  assert all(c.find('failure').attrib.get('type')=='AssertionError' for c in failures)\n  assert len(cases)-len(failures)==0\n else:\n  assert not failures\n  assert sorted(c.attrib['name'] for c in cases)==(CFG['consumer_names'] if mode=='consumers' else CFG['all_names'])\n result={'mode':mode,'tests':len(cases),'passed':len(cases)-len(failures),'failed_names':[c.attrib['name'] for c in failures],'errors':len(errors),'skipped':len(skips)}\n write('native-'+mode+'-oracle.json',result)\n print(json.dumps(result))\ndef native(mode):\n files=[CFG['test_path']]\n if mode=='consumers': files += CFG['consumer_files']\n xml=EVIDENCE/('native-'+mode+'.xml')\n cmd=['bun','test',*files,'--reporter=junit','--reporter-outfile='+str(xml)]\n with (EVIDENCE/('native-'+mode+'.log')).open('w') as log:\n  r=subprocess.run(cmd,cwd=SRC,stdout=log,stderr=subprocess.STDOUT)\n assert r.returncode==(1 if mode=='before' else 0), ('unexpected native exit',mode,r.returncode)\n check_junit(xml,mode)\n logtext=(EVIDENCE/('native-'+mode+'.log')).read_text()\n reports=[json.loads(line.split('SETTINGS_IME_PROOF ',1)[1]) for line in logtext.splitlines() if line.startswith('SETTINGS_IME_PROOF ')]\n assert len(reports)==1,reports\n expected={'before': {'value': 'owned draftni', 'dialogs': 1}, 'after': {'keys': [{'key': 'Escape', 'composing': True, 'trusted': True}], 'dialogs': 0, 'draftRetained': False}, 'normalEscapeClosed': None, 'normalKey': None} if mode=='before' else {'before': {'value': 'owned draftni', 'dialogs': 1}, 'after': {'keys': [{'key': 'Escape', 'composing': True, 'trusted': True}], 'dialogs': 1, 'draftRetained': True}, 'normalEscapeClosed': True, 'normalKey': {'key': 'Escape', 'composing': False, 'trusted': True}}\n assert reports[0]==expected,reports\n write('native-'+mode+'-browser-contract.json',reports[0])\ndef baseline():\n install_guard()\n call(['git','apply','--check',str(INPUT/'tests.patch')])\n call(['git','apply',str(INPUT/'tests.patch')])\n call(['git','add','-N','--',CFG['test_path']])\n for name,digest in CFG['baseline_hashes'].items(): assert sha(SRC/name)==digest,name\n assert sha(SRC/CFG['test_path'])==CFG['file_hashes'][CFG['test_path']]\n assert set(call(['git','diff','--name-only']).splitlines())=={CFG['test_path']}\n native('before')\n\ndef apply_candidate(full=False):\n assert_base()\n part='candidate.patch' if full else 'production.patch'\n call(['git','apply','--check',str(INPUT/part)])\n call(['git','apply',str(INPUT/part)])\n call(['git','add','-N','--',CFG['test_path']])\n assert set(call(['git','diff','--name-only']).splitlines())==OWNED\n for name,digest in CFG['file_hashes'].items(): assert sha(SRC/name)==digest,name\n assert tree()==CFG['tree'], 'candidate working tree does not match reviewed tree'\n call(['git','diff','--check'])\n write('candidate-source-guard.json',{'base':CFG['base'],'tree':tree(),'files':CFG['file_hashes'],'patch_sha256':CFG['patch_sha']})\n write('candidate-tracked.json',tracked())\ndef record_resolution():\n install_guard()\n lock=SRC/'package-lock.json'\n assert lock.exists()\n (INPUT/'package-lock.json').write_bytes(lock.read_bytes())\n record={'root_lock_provenance':'resolved once by npm from immutable public base; not a committed repository lock','sha256':sha(lock),'node':call(['node','--version']),'npm':call(['npm','--version']),'bun':call(['bun','--version']),'bun_binary_sha256':sha(pathlib.Path(call(['which','bun'])).resolve()),'package_json_sha256':sha(SRC/'package.json'),'plugin_lock_sha256':sha(SRC/'plugin/bun.lock')}\n (INPUT/'dependency-resolution.json').write_text(json.dumps(record,indent=2)+'\\n')\n write('dependency-resolution.json',record)\n with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('lock_sha='+record['sha256']+'\\n')\ndef use_resolution():\n record=json.loads((INPUT/'dependency-resolution.json').read_text())\n expected=os.environ['EXPECTED_LOCK_SHA']\n assert len(expected)==64 and all(c in '0123456789abcdef' for c in expected)\n assert record['sha256']==expected==sha(INPUT/'package-lock.json')\n assert sha(INPUT/'candidate.patch')==CFG['patch_sha'], 'downloaded patch changed'\n assert record['bun_binary_sha256']==sha(pathlib.Path(call(['which','bun'])).resolve()), 'Bun binary differs across jobs'\n assert record['package_json_sha256']==sha(SRC/'package.json')\n assert record['node']==call(['node','--version']) and record['bun']==call(['bun','--version'])\n (SRC/'package-lock.json').write_bytes((INPUT/'package-lock.json').read_bytes())\n write('downloaded-resolution-verified.json',record)\ndef protected_guard():\n assert_base()\n expected=json.loads((EVIDENCE/'candidate-tracked.json').read_text())\n actual=tracked()\n changes={name:{'before':digest,'after':actual.get(name)} for name,digest in expected.items() if actual.get(name)!=digest}\n forbidden=[name for name in changes if not generated(name)]\n write('generated-build-changes.json',{'generated_changes':changes,'forbidden_source_changes':forbidden,'note':'generated output is evidence only; never staged or published by this workflow'})\n assert not forbidden, forbidden\n for name,digest in CFG['file_hashes'].items(): assert sha(SRC/name)==digest,name\n sizes={}\n for name,budget in [('worker-service.cjs',2900*1024),('mcp-server.cjs',600*1024),('transcript-watcher.cjs',200*1024)]:\n  p=SRC/'plugin/scripts'/name\n  if p.exists(): sizes[name]={'bytes':p.stat().st_size,'sha256':sha(p),'advisory_budget_bytes':budget,'over_advisory':p.stat().st_size>budget}\n write('bundle-observations.json',{'bundles':sizes,'budgets_are_advisory_in_upstream_source':True,'hard_integrity_checks':'npm run build enforces bundle parse, absolute-path, external-Zod and distribution assertions; warnings are not hard size gates'})\n write('final-source-guard.json',{'base':CFG['base'],'reviewed_candidate_tree_before_build':CFG['tree'],'protected_source_unchanged':True})\ndef selftest():\n check_junit(pathlib.Path(sys.argv[2]),sys.argv[3])\nif __name__=='__main__':\n commands={'initialize':initialize,'install-guard':install_guard,'baseline':baseline,'apply-candidate':apply_candidate,'apply-full-candidate':lambda:apply_candidate(True),'native-after':lambda:native('after'),'native-consumers':lambda:native('consumers'),'record-resolution':record_resolution,'use-resolution':use_resolution,'protected-guard':protected_guard,'oracle-selftest':selftest}\n commands[sys.argv[1]]()\nPY_QUALIFICATION\n\ngit init \"$TASK_DIR/source\"\ngit -C \"$TASK_DIR/source\" remote add origin https://github.com/thedotmack/claude-mem.git\ngit -C \"$TASK_DIR/source\" fetch --no-tags --depth=1 origin 325afb60108d4ab04e24d715f244bd591ca33fbe\ngit -C \"$TASK_DIR/source\" checkout --detach FETCH_HEAD\ngit -C \"$TASK_DIR/source\" update-ref refs/remotes/origin/main 325afb60108d4ab04e24d715f244bd591ca33fbe\nset -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nSOURCE_DIR=\"$TASK_DIR/source\"\nEVIDENCE_DIR=\"$TASK_DIR/evidence\"\nINPUT_DIR=\"$TASK_DIR/input\"\nTASK_HOME=\"$TASK_DIR/home\"\nexport CLAUDE_CONFIG_DIR=\"$TASK_HOME/.claude\"\nexport CLAUDE_MEM_DATA_DIR=\"$TASK_HOME/.claude-mem\"\nexport XDG_CONFIG_HOME=\"$TASK_HOME/.config\"\nexport XDG_DATA_HOME=\"$TASK_HOME/.local/share\"\nexport XDG_CACHE_HOME=\"$TASK_HOME/.cache\"\nexport npm_config_cache=\"$TASK_DIR/npm-cache\"\nexport BUN_INSTALL_CACHE_DIR=\"$TASK_DIR/bun-cache\"\nexport DO_NOT_TRACK=1\nexport CLAUDE_MEM_TELEMETRY=0\nmkdir -p \"$EVIDENCE_DIR\" \"$INPUT_DIR\" \"$TASK_HOME\" \"$CLAUDE_CONFIG_DIR\" \"$CLAUDE_MEM_DATA_DIR\" \"$XDG_CONFIG_HOME\" \"$XDG_DATA_HOME\" \"$XDG_CACHE_HOME\"\nunset CLAUDE_PLUGIN_ROOT PLUGIN_ROOT ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY CLAUDE_CODE_OAUTH_TOKEN COMPOSIO_API_KEY\ncd \"$SOURCE_DIR\"\ntest \"$(node --version)\" = \"v20.19.0\"\ntest \"$(bun --version)\" = \"1.4.2\"\npython3 \"$TASK_DIR/qualification.py\" initialize\n"
        },
        {
          "name": "Download verified dependency-resolution snapshot",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "claude-mem-marker-inputs",
            "path": "${{ runner.temp }}/claude-mem-qualification/resolution-download",
            "run-id": 41013383947,
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Import only verified dependency resolution without overwriting new patches",
          "run": "set -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\ncp \"$TASK_DIR/resolution-download/package-lock.json\" \"$TASK_DIR/input/package-lock.json\"\ncp \"$TASK_DIR/resolution-download/dependency-resolution.json\" \"$TASK_DIR/input/dependency-resolution.json\"\n"
        },
        {
          "name": "Install identical captured dependencies on unchanged canonical source",
          "run": "set -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nSOURCE_DIR=\"$TASK_DIR/source\"\nEVIDENCE_DIR=\"$TASK_DIR/evidence\"\nINPUT_DIR=\"$TASK_DIR/input\"\nTASK_HOME=\"$TASK_DIR/home\"\nexport CLAUDE_CONFIG_DIR=\"$TASK_HOME/.claude\"\nexport CLAUDE_MEM_DATA_DIR=\"$TASK_HOME/.claude-mem\"\nexport XDG_CONFIG_HOME=\"$TASK_HOME/.config\"\nexport XDG_DATA_HOME=\"$TASK_HOME/.local/share\"\nexport XDG_CACHE_HOME=\"$TASK_HOME/.cache\"\nexport npm_config_cache=\"$TASK_DIR/npm-cache\"\nexport BUN_INSTALL_CACHE_DIR=\"$TASK_DIR/bun-cache\"\nexport DO_NOT_TRACK=1\nexport CLAUDE_MEM_TELEMETRY=0\nmkdir -p \"$EVIDENCE_DIR\" \"$INPUT_DIR\" \"$TASK_HOME\" \"$CLAUDE_CONFIG_DIR\" \"$CLAUDE_MEM_DATA_DIR\" \"$XDG_CONFIG_HOME\" \"$XDG_DATA_HOME\" \"$XDG_CACHE_HOME\"\nunset CLAUDE_PLUGIN_ROOT PLUGIN_ROOT ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY CLAUDE_CODE_OAUTH_TOKEN COMPOSIO_API_KEY\ncd \"$SOURCE_DIR\"\npython3 \"$TASK_DIR/qualification.py\" use-resolution\nnpm ci --no-audit --no-fund > \"$EVIDENCE_DIR/root-frozen-install.log\" 2>&1\npython3 \"$TASK_DIR/qualification.py\" install-guard\n",
          "env": {
            "EXPECTED_LOCK_SHA": "4fbc66f858ab6c473156741de4aab6413548c7d7651ab2be510e35c4a0abef1b"
          },
          "timeout-minutes": 20
        },
        {
          "name": "Measure unchanged semantic-filter cases on canonical base and exact candidate",
          "timeout-minutes": 10,
          "run": "set -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nSOURCE_DIR=\"$TASK_DIR/source\"\nEVIDENCE_DIR=\"$TASK_DIR/evidence\"\nINPUT_DIR=\"$TASK_DIR/input\"\nTASK_HOME=\"$TASK_DIR/home\"\nexport CLAUDE_CONFIG_DIR=\"$TASK_HOME/.claude\"\nexport CLAUDE_MEM_DATA_DIR=\"$TASK_HOME/.claude-mem\"\nexport XDG_CONFIG_HOME=\"$TASK_HOME/.config\"\nexport XDG_DATA_HOME=\"$TASK_HOME/.local/share\"\nexport XDG_CACHE_HOME=\"$TASK_HOME/.cache\"\nexport npm_config_cache=\"$TASK_DIR/npm-cache\"\nexport BUN_INSTALL_CACHE_DIR=\"$TASK_DIR/bun-cache\"\nexport DO_NOT_TRACK=1\nexport CLAUDE_MEM_TELEMETRY=0\nmkdir -p \"$EVIDENCE_DIR\" \"$INPUT_DIR\" \"$TASK_HOME\" \"$CLAUDE_CONFIG_DIR\" \"$CLAUDE_MEM_DATA_DIR\" \"$XDG_CONFIG_HOME\" \"$XDG_DATA_HOME\" \"$XDG_CACHE_HOME\"\nunset CLAUDE_PLUGIN_ROOT PLUGIN_ROOT ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY CLAUDE_CODE_OAUTH_TOKEN COMPOSIO_API_KEY\ncd \"$SOURCE_DIR\"\npython3 - <<'PY_SEMANTIC_DIAGNOSTIC'\nimport pathlib,subprocess,json,hashlib,os,xml.etree.ElementTree as ET,time\nroot=pathlib.Path.cwd();task=pathlib.Path(os.environ['RUNNER_TEMP'])/'claude-mem-qualification';proof=task/'evidence';path='tests/worker/observation-semantic-filters.test.ts'\nsha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()\nbase_sha=sha(root/path);results=[]\ndef run(label):\n xml=proof/('semantic-'+label+'.xml');log=proof/('semantic-'+label+'.log');started=time.monotonic()\n with log.open('w') as output:r=subprocess.run(['bun','test',path,'--reporter=junit','--reporter-outfile='+str(xml)],stdout=output,stderr=subprocess.STDOUT)\n record={'label':label,'exit_code':r.returncode,'elapsed_seconds':time.monotonic()-started,'test_file_sha256':sha(root/path),'cases':[]}\n if xml.exists():\n  for case in ET.parse(xml).iter('testcase'):\n   record['cases'].append({'name':case.attrib.get('name'),'time':case.attrib.get('time'),'failure':case.find('failure').attrib if case.find('failure') is not None else None,'error':case.find('error').attrib if case.find('error') is not None else None,'skip':case.find('skipped') is not None})\n else:record['missing_junit']=True\n results.append(record);(proof/'semantic-comparison.json').write_text(json.dumps({'status':'DIAGNOSTIC_ONLY_NOT_QUALIFICATION','results':results},indent=2))\nrun('canonical-base')\nassert sha(root/path)==base_sha,'existing test file changed during baseline'\nsubprocess.run(['python3',str(task/'qualification.py'),'apply-full-candidate'],check=True)\nrun('exact-candidate')\nassert sha(root/path)==base_sha,'existing test file changed during candidate'\nsubprocess.run(['python3',str(task/'qualification.py'),'protected-guard'],check=True)\nrecord={'status':'DIAGNOSTIC_ONLY_NOT_QUALIFICATION','base':'325afb60108d4ab04e24d715f244bd591ca33fbe','candidate_tree':'2bc013a50679c7a4cf936d8446a981c713daff1f','existing_test_file_sha256':base_sha,'same_test_file_before_after':True,'timeout_policy':'unchanged Bun default5000ms per test, no --timeout overrides, no test/source edits','results':results}\n(proof/'semantic-comparison.json').write_text(json.dumps(record,indent=2));print(json.dumps(record))\n\nPY_SEMANTIC_DIAGNOSTIC\n"
        },
        {
          "name": "Retain bounded proof logs and guards",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "settings-ime-semantic-base-candidate-diagnostic",
