{
  "name": "CowAgent full-prefix Linux diagnosis",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Provision exact public source and real dependencies",
          "run": "set -euo pipefail\ngit init \"$RUNNER_TEMP/cow\"\ngit -C \"$RUNNER_TEMP/cow\" remote add origin https://github.com/rudycelekli/CowAgent.git\ngit -C \"$RUNNER_TEMP/cow\" fetch --depth=1 origin f4d1689bf367b34bd0fefa9dbdba34851efffd40\ngit -C \"$RUNNER_TEMP/cow\" checkout --detach FETCH_HEAD\nmkdir -p \"$RUNNER_TEMP/plugin\" \"$RUNNER_TEMP/psdiag\"\nprintf '%s' '' | base64 --decode > \"$RUNNER_TEMP/plugin/ps_pytest_diagnostics.py\"\npython -m pip install -r \"$RUNNER_TEMP/cow/requirements.txt\" pytest\n"
        },
        {
          "name": "Observe exact full-suite prefix until first failure",
          "continue-on-error": true,
          "working-directory": "${{ runner.temp }}/cow",
          "env": {
            "PYTHONPATH": "${{ runner.temp }}/plugin",
            "COW_PS_DIAGNOSTICS": "${{ runner.temp }}/psdiag/full-prefix"
          },
          "run": "python -m pytest -p ps_pytest_diagnostics tests/ --maxfail=1 -q"
        },
        {
          "name": "Preserve native observations",
          "if": "always()",
          "run": "find \"$RUNNER_TEMP/psdiag\" -name observations.jsonl -type f -exec cat {} +"
        }
      ]
    }
  }
}
