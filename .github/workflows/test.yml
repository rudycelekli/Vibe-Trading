{
  "name": "Thinkrail draft image baseline oracle only",
  "on": {
    "push": {
      "branches": [
        "validation/thinkrail-draft-baseline-20261030"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.4",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun144';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.4',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.4'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Fetch immutable public source and apply regression only",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/thinkrail\"\ncd \"$RUNNER_TEMP/thinkrail\"\ngit init -q\ngit remote add origin https://github.com/JetBrains/thinkrail.git\ngit fetch --depth=1 origin df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\"\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('');assert hashlib.sha256(b).hexdigest()=='4b70358a4cd1849367325ec05df58d5e80b23632d58d4dad8043d54895ee36a6'\npathlib.Path('/tmp/thinkrail-draft-regression.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/thinkrail-draft-regression.patch\ngit apply /tmp/thinkrail-draft-regression.patch\ngit diff --check\n"
        },
        {
          "name": "Install exact repository dependencies and browser",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ntest \"$(bun --version)\" = \"1.4.4\"\nbun install --frozen-lockfile\nbun x playwright install --with-deps chromium\n"
        },
        {
          "name": "Require the native pre-fix failure signature",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nmkdir -p \"$RUNNER_TEMP/thinkrail-proof\"\nset +e\nPLAYWRIGHT_JSON_OUTPUT_FILE=\"$RUNNER_TEMP/thinkrail-proof/baseline.json\" bun run e2e -- --serial e2e/composer-images.spec.ts -g \"draft image attachments survive a chat tab remount\" --retries=0 --workers=1 --reporter=json > \"$RUNNER_TEMP/thinkrail-proof/baseline.log\" 2>&1\nstatus=$?\nset -e\nexport BASELINE_STATUS=\"$status\"\npython3 - <<'PYORACLE'\nimport pathlib,json,os,re\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail-proof';d=json.loads((p/'baseline.json').read_text())\nassert not d.get('errors'), d.get('errors')\nrows=[]\ndef walk(s):\n for spec in s.get('specs',[]):\n  if spec['title']=='draft image attachments survive a chat tab remount':rows.extend(spec['tests'])\n for child in s.get('suites',[]):walk(child)\nwalk(d)\nassert len(rows)==1,rows\nresults=rows[0]['results'];assert len(results)==1,results\nresult=results[0];assert result['status']=='failed',result\nerrors='\\n'.join(e.get('message','') for e in result.get('errors',[]))\nerrors=re.sub(r'\\x1b\\[[0-9;]*m','',errors)\nassert 'composer-image' in errors and 'Expected: 1' in errors and 'Received: 0' in errors,errors\nassert int(os.environ['BASELINE_STATUS'])!=0\n(p/'oracle-result.json').write_text(json.dumps({'scope':'BASELINE ONLY; not candidate qualification','expected_failures':1,'observed_status':result['status'],'failure_signature':'composer-image expected1 received0 after tab remount'},indent=2))\nPYORACLE\n"
        },
        {
          "name": "Upload diagnostic proof",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "thinkrail-draft-image-baseline",
            "retention-days": 7,
            "path": "${{ runner.temp }}/thinkrail-proof/\n${{ runner.temp }}/thinkrail/test-results/"
          }
        }
      ]
    }
  }
}
