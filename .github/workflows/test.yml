name: CowAgent native ps width diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose native Linux process output on exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/cow"
          git -C "$RUNNER_TEMP/cow" remote add origin https://github.com/rudycelekli/CowAgent.git
          git -C "$RUNNER_TEMP/cow" fetch --depth=1 origin f4d1689bf367b34bd0fefa9dbdba34851efffd40
          git -C "$RUNNER_TEMP/cow" checkout --detach FETCH_HEAD
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/diagnose.py"
          python3 "$RUNNER_TEMP/diagnose.py" "$RUNNER_TEMP/cow" "$RUNNER_TEMP/cow-proof"
