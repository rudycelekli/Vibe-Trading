{
  "name": "Thinkrail draft attachment exact-tree qualification",
  "on": {
    "push": {
      "branches": [
        "validation/thinkrail-draft-qualified-20261030"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualification": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.4",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun144';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.4',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.4'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Fetch immutable source and require exact reviewed candidate tree",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/thinkrail\" \"$RUNNER_TEMP/thinkrail-proof\"\ncd \"$RUNNER_TEMP/thinkrail\"\ngit init -q\ngit remote add origin https://github.com/JetBrains/thinkrail.git\ngit fetch --depth=1 origin df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\"\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='9b3eab71bbbabf357da98a3b1cfae8a8b0bdf5a88c9e71687196c145d420b4e6'\npathlib.Path('/tmp/thinkrail-candidate.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/thinkrail-candidate.patch\ngit apply /tmp/thinkrail-candidate.patch\ngit diff --check\ngit add --all\ntest \"$(git write-tree)\" = \"15251ced959b4226f724568ec5c810c1c60cc8a4\"\n"
        },
        {
          "name": "Install frozen repository dependencies and matching browser",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ntest \"$(bun --version)\" = \"1.4.4\"\nbun install --frozen-lockfile\nbun x playwright install --with-deps chromium\n"
        },
        {
          "name": "Required check:deps",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:deps > \"$RUNNER_TEMP/thinkrail-proof/check-deps.log\" 2>&1\n"
        },
        {
          "name": "Required check:boundaries",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:boundaries > \"$RUNNER_TEMP/thinkrail-proof/check-boundaries.log\" 2>&1\n"
        },
        {
          "name": "Required check:seams",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:seams > \"$RUNNER_TEMP/thinkrail-proof/check-seams.log\" 2>&1\n"
        },
        {
          "name": "Required lint",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run lint > \"$RUNNER_TEMP/thinkrail-proof/lint.log\" 2>&1\n"
        },
        {
          "name": "Required typecheck",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run typecheck > \"$RUNNER_TEMP/thinkrail-proof/typecheck.log\" 2>&1\n"
        },
        {
          "name": "Required check:spec-surface",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:spec-surface > \"$RUNNER_TEMP/thinkrail-proof/check-spec-surface.log\" 2>&1\n"
        },
        {
          "name": "Required check:compiler",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:compiler > \"$RUNNER_TEMP/thinkrail-proof/check-compiler.log\" 2>&1\n"
        },
        {
          "name": "Required test",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run test > \"$RUNNER_TEMP/thinkrail-proof/test.log\" 2>&1\n"
        },
        {
          "name": "Require all focused native image regressions and controls",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nPLAYWRIGHT_JSON_OUTPUT_FILE=\"$RUNNER_TEMP/thinkrail-proof/focused.json\" bun run e2e -- --serial e2e/composer-images.spec.ts --retries=0 --workers=1 --reporter=json > \"$RUNNER_TEMP/thinkrail-proof/focused.log\" 2>&1\npython3 - <<'PYORACLE'\nimport json,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail-proof'\nd=json.loads((p/'focused.json').read_text())\nassert not d.get('errors'),d.get('errors')\nrows=[]\ndef walk(s):\n for spec in s.get('specs',[]):\n  for test in spec['tests']:rows.append((spec['title'],test))\n for child in s.get('suites',[]):walk(child)\nwalk(d)\nexpected=['pasting an oversized image downscales it to the 1568px long edge before it can be sent', 'pasting a small image leaves its dimensions untouched', 'pasting a within-bounds BMP re-encodes it to a provider-accepted type', 'an undecodable provider-unsupported file is refused with an error chip, never attached raw', '/compact preserves attached images and its draft until the images are removed', 'draft image attachments survive a chat tab remount', 'draft images are isolated by chat and removed images do not return after remount', 'pending image decoding survives a chat remount and keeps Send disabled', 'an accepted composer submission clears its image draft across remounts']\nassert sorted(n for n,t in rows)==sorted(expected),[(n,t.get('status')) for n,t in rows]\nfor name,test in rows:\n assert len(test['results'])==1,(name,test)\n assert test['results'][0]['status']=='passed',(name,test)\n(p/'focused-oracle.json').write_text(json.dumps({'scope':'exact candidate focused real-browser suite','passed':len(rows),'titles':expected},indent=2))\nPYORACLE\n"
        },
        {
          "name": "Required complete no-agent browser suite once after implementation",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nTHINKRAIL_E2E_SKIP_BUILD=1 bun run e2e > \"$RUNNER_TEMP/thinkrail-proof/full-e2e.log\" 2>&1\n"
        },
        {
          "name": "Require unchanged reviewed source after all checks",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ngit diff --exit-code\ntest \"$(git write-tree)\" = \"15251ced959b4226f724568ec5c810c1c60cc8a4\"\ngit diff --cached --check\nprintf \"%s\\n\" \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\" \"15251ced959b4226f724568ec5c810c1c60cc8a4\" > \"$RUNNER_TEMP/thinkrail-proof/exact-source.txt\"\n"
        },
        {
          "name": "Upload verification evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "thinkrail-draft-image-candidate",
            "retention-days": 7,
            "path": "${{ runner.temp }}/thinkrail-proof/\n${{ runner.temp }}/thinkrail/test-results/\n${{ runner.temp }}/thinkrail/playwright-report/"
          }
        }
      ]
    }
  }
}
