        },
        {
          "id": "prepare",
          "name": "Materialize exact reviewed source and dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/openbot\" \"$RUNNER_TEMP/audit-qualification\"\ncd \"$RUNNER_TEMP/openbot\"\ngit init -q\ngit remote add origin https://github.com/CopilotKit/OpenBot.git\ngit fetch --depth=1 origin ab9855c19848378c90a806426130d86699cc798c\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = ab9855c19848378c90a806426130d86699cc798c\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='b0d6481e908a6b105acd57e3c4a79b6f0f1cc32d6701c462ad92b06011d66476'\npathlib.Path('/tmp/openbot-876.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/openbot-876.patch\ngit apply /tmp/openbot-876.patch\ngit diff --check\ngit add CHANGELOG.md server/src/audit.ts server/src/plugins/plugin-store/context.ts server/tests/arcade-completion-transaction.integration.test.ts\ntest \"$(git write-tree)\" = 5dea812d839c12264f50d0453921df9b19b685cf\nbun --version | tee \"$RUNNER_TEMP/audit-qualification/bun-version.txt\"\ntest \"$(bun --version)\" = 1.4.3\nbun install --frozen-lockfile\n"
        },
        {
          "name": "format",
          "shell": "bash",
          "if": "${{ !cancelled() && steps.prepare.outcome == 'success' }}",
          "run": "set -uo pipefail\ncd \"$RUNNER_TEMP/openbot\"\nset +e\n( set -euo pipefail\nbun run format:check\n) > \"$RUNNER_TEMP/audit-qualification/format.log\" 2>&1\nresult=$?\ncat \"$RUNNER_TEMP/audit-qualification/format.log\"\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/audit-qualification/format.exit\"\nexit \"$result\"\n"
        },
        {
          "name": "lint",
          "shell": "bash",
          "if": "${{ !cancelled() && steps.prepare.outcome == 'success' }}",
