{
  "name": "OpenBot 876 exact-source Linux qualification proposal",
  "on": {
    "push": {
      "branches": [
        "validation/openbot-authorization-audit-qualified-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "static": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.3",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun143';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.3',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.3'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nos.symlink('bun',p/'bunx')\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "id": "prepare",
          "name": "Materialize exact reviewed source and dependencies",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/openbot\" \"$RUNNER_TEMP/audit-qualification\"\ncd \"$RUNNER_TEMP/openbot\"\ngit init -q\ngit remote add origin https://github.com/CopilotKit/OpenBot.git\ngit fetch --depth=1 origin ab9855c19848378c90a806426130d86699cc798c\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = ab9855c19848378c90a806426130d86699cc798c\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='fd417d59db99e06147a105d6812c8dcce781eea41b668aca56549ac7134c4958'\npathlib.Path('/tmp/openbot-876.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/openbot-876.patch\ngit apply /tmp/openbot-876.patch\ngit diff --check\ngit add CHANGELOG.md server/src/audit.ts server/src/plugins/plugin-store/context.ts server/tests/arcade-completion-transaction.integration.test.ts\ntest \"$(git write-tree)\" = 5c7b9fab397252e36771ed915397b1eb54bc469c\nbun --version | tee \"$RUNNER_TEMP/audit-qualification/bun-version.txt\"\ntest \"$(bun --version)\" = 1.4.3\nbun install --frozen-lockfile\n"
        },
        {
          "name": "format",
          "shell": "bash",
          "if": "${{ !cancelled() && steps.prepare.outcome == 'success' }}",
          "run": "set -uo pipefail\ncd \"$RUNNER_TEMP/openbot\"\nset +e\n( set -euo pipefail\nbun run format:check\n) > \"$RUNNER_TEMP/audit-qualification/format.log\" 2>&1\nresult=$?\ncat \"$RUNNER_TEMP/audit-qualification/format.log\"\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/audit-qualification/format.exit\"\nexit \"$result\"\n"
        },
        {
          "name": "Verify exact candidate remains unchanged",
          "if": "${{ always() && steps.prepare.outcome == 'success' }}",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/openbot\"\ngit diff --exit-code\ntest \"$(git write-tree)\" = 5c7b9fab397252e36771ed915397b1eb54bc469c\nif test -n \"$(git status --porcelain -- server/drizzle)\"; then git status --porcelain -- server/drizzle; exit 1; fi\ngit status --short > \"$RUNNER_TEMP/audit-qualification/final-status.txt\"\nprintf '%s\\n' \"$(git rev-parse HEAD)\" \"$(git write-tree)\" > \"$RUNNER_TEMP/audit-qualification/source-identity.txt\"\n"
        },
        {
          "name": "Upload exact-source qualification receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "openbot-876-static",
            "path": "${{ runner.temp }}/audit-qualification",
            "if-no-files-found": "warn"
          }
        }
      ],
      "if": "${{ github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/openbot-authorization-audit-qualified-20261030' }}",
      "env": {
        "DATABASE_URL": "postgres://openbot:openbot@localhost:5432/openbot_test"
      }
    }
  }
}
