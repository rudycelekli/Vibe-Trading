{
  "name": "test",
  "on": {
    "push": {
      "branches": [
        "validation/thinkrail-loose-list-qualified-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualification": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.4",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun144';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.4',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.4'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Fetch immutable source and require exact reviewed candidate tree",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/thinkrail\" \"$RUNNER_TEMP/thinkrail-proof\"\ncd \"$RUNNER_TEMP/thinkrail\"\ngit init -q\ngit remote add origin https://github.com/JetBrains/thinkrail.git\ngit fetch --depth=1 origin df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\"\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='5ad2c5f90807fa6e4faa5bd94bade17349a76ecbaa35baf34bbffccb0232839b'\npathlib.Path('/tmp/thinkrail-candidate.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/thinkrail-candidate.patch\ngit apply /tmp/thinkrail-candidate.patch\ngit diff --check\ngit add --all\ntest \"$(git write-tree)\" = \"0ed31a05ce8a1594fce6741a452e06ddb3d16262\"\n"
        },
        {
          "name": "Install frozen repository dependencies and matching browser",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ntest \"$(bun --version)\" = \"1.4.4\"\nbun install --frozen-lockfile\nbun x playwright install --with-deps chromium\n"
        },
        {
          "name": "Required check:deps",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:deps > \"$RUNNER_TEMP/thinkrail-proof/check-deps.log\" 2>&1\n"
        },
        {
          "name": "Required check:boundaries",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:boundaries > \"$RUNNER_TEMP/thinkrail-proof/check-boundaries.log\" 2>&1\n"
        },
        {
          "name": "Required check:seams",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:seams > \"$RUNNER_TEMP/thinkrail-proof/check-seams.log\" 2>&1\n"
        },
        {
          "name": "Required lint",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run lint > \"$RUNNER_TEMP/thinkrail-proof/lint.log\" 2>&1\n"
        },
        {
          "name": "Required typecheck",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run typecheck > \"$RUNNER_TEMP/thinkrail-proof/typecheck.log\" 2>&1\n"
        },
        {
          "name": "Required check:spec-surface",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:spec-surface > \"$RUNNER_TEMP/thinkrail-proof/check-spec-surface.log\" 2>&1\n"
        },
        {
          "name": "Required check:compiler",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run check:compiler > \"$RUNNER_TEMP/thinkrail-proof/check-compiler.log\" 2>&1\n"
        },
        {
          "name": "Required test",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nbun run test > \"$RUNNER_TEMP/thinkrail-proof/test.log\" 2>&1\n"
        },
        {
          "name": "Require native loose-list geometry and tight-list controls",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nPLAYWRIGHT_JSON_OUTPUT_FILE=\"$RUNNER_TEMP/thinkrail-proof/focused.json\" bun run e2e -- --serial e2e/chat-loose-list-alignment.spec.ts --retries=0 --workers=1 --reporter=json > \"$RUNNER_TEMP/thinkrail-proof/focused.log\" 2>&1\npython3 - <<'PYORACLE'\nimport json,pathlib,os\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail'\nproof=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail-proof'\nx=json.loads((proof/'focused.json').read_text());assert not x.get('errors'),x.get('errors')\nspecs=[]\ndef walk(s):\n specs.extend(s.get('specs',[]))\n for child in s.get('suites',[]):walk(child)\nfor s in x.get('suites',[]):walk(s)\nexpected={\"settled loose list text stays on the marker's first line\", \"loose lists preserve wrapping, paragraphs, nesting and copy at 1280px\", \"loose lists preserve wrapping, paragraphs, nesting and copy at 900px\"}\nassert len(specs)==3 and {s['title'] for s in specs}==expected,specs\nfor s in specs:\n assert len(s['tests'])==1,s\n r=s['tests'][0]['results'];assert len(r)==1 and r[0]['status']=='passed',r\npngs=list((root/'test-results').rglob('loose-list-alignment.png'));assert len(pngs)==1,pngs\ngeometries=list((root/'test-results').rglob('loose-list-geometry.json'));assert len(geometries)==1,geometries\ng=json.loads(geometries[0].read_text());assert len(g)==6,g\nassert sum(a['loose'] for a in g)==4,g\nassert all(a['lineHeight']>0 and a['textTop']-a['itemTop']<a['lineHeight']/2 for a in g),g\n(proof/'loose-list-alignment.png').write_bytes(pngs[0].read_bytes())\n(proof/'focused-geometry.json').write_text(json.dumps(g,indent=2))\nboundaries=list((root/'test-results').rglob('list-boundary-geometry.json'));assert len(boundaries)==2,boundaries\nfor i,path in enumerate(boundaries):\n g=json.loads(path.read_text());lines=g['firstLines'];assert len(lines)>1,g\n assert lines[0]['top']<g['itemTop']+g['lineHeight']/2,g\n assert g['laterTop']>lines[-1]['bottom'],g\n assert g['nestedTop']>=g['laterBottom'],g\n assert g['nestedGlyphTop']-g['nestedItemTop']<g['nestedLineHeight']/2,g\n assert len(g['longMarkers'])==2 and all(a['textTop']-a['itemTop']<a['lineHeight']/2 for a in g['longMarkers']),g\n (proof/f'boundary-geometry-{i}.json').write_text(json.dumps(g,indent=2))\nfor width in (1280,900):\n for name in (f'list-wrapping-{width}.png',f'list-boundaries-{width}.png'):\n  shots=list((root/'test-results').rglob(name));assert len(shots)==1,shots\n  (proof/name).write_bytes(shots[0].read_bytes())\n(proof/'focused-pass.json').write_text(json.dumps({'status':'PASS','tests':3,'viewport':'1280x800','controls':'2 tight,4 loose first lines','png':str(pngs[0])},indent=2))\nPYORACLE\n"
        },
        {
          "name": "Required complete no-agent browser suite once after implementation",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nTHINKRAIL_E2E_SKIP_BUILD=1 bun run e2e > \"$RUNNER_TEMP/thinkrail-proof/full-e2e.log\" 2>&1\n"
        },
        {
          "name": "Require unchanged reviewed source after all checks",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ngit diff --exit-code\ntest -z \"$(git ls-files --others --exclude-standard)\"\ntest \"$(git write-tree)\" = \"0ed31a05ce8a1594fce6741a452e06ddb3d16262\"\ngit diff --cached --check\nprintf \"%s\\n\" \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\" \"0ed31a05ce8a1594fce6741a452e06ddb3d16262\" > \"$RUNNER_TEMP/thinkrail-proof/exact-source.txt\"\n"
        },
        {
          "name": "Upload verification evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "thinkrail-loose-list-candidate-qualification",
            "retention-days": 7,
            "path": "${{ runner.temp }}/thinkrail-proof/\n${{ runner.temp }}/thinkrail/test-results/\n${{ runner.temp }}/thinkrail/playwright-report/"
          }
        }
      ],
      "if": "${{ github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/thinkrail-loose-list-qualified-20261030' }}"
    }
  }
}
