name: Private Ciphey native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ciphey-native-qualification-20261028
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set one shared bounded deadline and verify required namespace tools
        shell: bash
        run: |
          set -euo pipefail
          echo "QUALIFICATION_DEADLINE=$(( $(date +%s) + 2400 ))" >> "$GITHUB_ENV"
          command -v sudo
          command -v unshare
          command -v runuser
          command -v rustup
          sudo unshare --net -- runuser --user "$(id -un)" -- test "$(id -u)" -ne 0
      - name: Checkout exact public upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bee-san/Ciphey
          ref: c806543f369d124fb8e308cfd6250c6557665888
          path: ciphey
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python for exact upstream Codespell version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact upstream spelling dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ciphey-qualification-setup"
          python -m pip install codespell==2.4.1 2>&1 | tee "$RUNNER_TEMP/ciphey-qualification-setup/codespell-install.log"
      - name: Install stable native toolchain, matching upstream CI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          mkdir -p "$RUNNER_TEMP/ciphey-qualification-setup"
          rustup run stable rustc -Vv | tee "$RUNNER_TEMP/ciphey-qualification-setup/toolchain.txt"
          unshare --version | tee "$RUNNER_TEMP/ciphey-qualification-setup/unshare-version.txt"
          runuser --version | tee "$RUNNER_TEMP/ciphey-qualification-setup/runuser-version.txt"
      - name: Unpack exact allowlisted public source and maintained tests
        shell: bash
        run: |
          python3 - <<'PYBUNDLE'
          import base64, gzip, hashlib, json, os, pathlib
          raw = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == '606c9b31a0f55a553dfc9df3f61001c92fd1350d9d9358dd9f56a36ee20c912e'
          files = json.loads(raw)
          expected = {'manifest.json', 'run-qualification.py', 'test-evaluator.py', 'independent-oracles.cjs', 'jwt-tests-only.patch', 'jwt-candidate.patch', 'decimal-tests-only.patch', 'decimal-candidate.patch'}
          assert set(files) == expected
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ciphey-qualification-bundle'
          out.mkdir()
          for name, text in files.items():
              (out / name).write_text(text)
          PYBUNDLE
      - name: Negative controls for actual evaluator and source guards
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/ciphey-qualification-bundle/test-evaluator.py" > "$RUNNER_TEMP/ciphey-qualification-setup/evaluator-selftest.log" 2>&1
      - name: Fetch locked crate dependencies only
        shell: bash
        working-directory: ciphey
        run: |
          set -euo pipefail
          rustup run stable cargo fetch --locked 2>&1 | tee "$RUNNER_TEMP/ciphey-qualification-setup/cargo-fetch.log"
      - name: Independent standards oracles
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/ciphey-qualification-bundle/independent-oracles.cjs" > "$RUNNER_TEMP/ciphey-qualification-setup/independent-oracles.json"
      - name: JWT isolated native before and after, then all required gates
        id: jwt
        shell: bash
        run: python3 "$RUNNER_TEMP/ciphey-qualification-bundle/run-qualification.py" jwt
      - name: Decimal isolated native before and after, then all required gates
        if: ${{ !cancelled() && steps.jwt.outcome != 'skipped' }}
        shell: bash
        run: python3 "$RUNNER_TEMP/ciphey-qualification-bundle/run-qualification.py" decimal
      - name: Always verify source, index, worktree and allowlists
        if: always()
        shell: bash
        run: |
          python3 - <<'PYGUARD'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'ciphey'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ciphey-qualification-setup'
          out.mkdir(exist_ok=True)
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ciphey-qualification-bundle'
          report = {'guard_passed': False}
          if not (root / '.git').exists() or not (bundle / 'manifest.json').exists():
              report['state'] = 'setup incomplete, source qualification did not finish'
              (out / 'always-after-source-guard.json').write_text(json.dumps(report, indent=2))
              raise SystemExit(1)
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args], text=True).strip()
          try:
              manifest = json.loads((bundle / 'manifest.json').read_text())
              base = manifest['jwt']['candidate']
              assert git('rev-parse', 'HEAD') == base['base']
              tree = git('write-tree')
              report.update(head=git('rev-parse', 'HEAD'), index_tree=tree)
              expected = [value for phases in manifest.values() for value in phases.values() if value['tree'] == tree]
              if tree == base['base_tree']:
                  assert git('diff', '--cached', '--name-only') == ''
              else:
                  assert len(expected) == 1, 'unrecognized staged tree'
                  value = expected[0]
                  assert git('diff', '--cached', '--name-only') == value['file']
                  assert hashlib.sha256((root / value['file']).read_bytes()).hexdigest() == value['postimage_sha256']
              assert git('diff', '--name-only') == '', 'worktree drift'
              assert git('ls-files', '--others', '--exclude-standard') == '', 'untracked source'
              subprocess.run(['git', '-C', str(root), 'diff', '--cached', '--check'], check=True)
              report['guard_passed'] = True
          finally:
              report['worktree_diff'] = git('diff', '--stat')
              report['staged_paths'] = git('diff', '--cached', '--name-only')
              (out / 'always-after-source-guard.json').write_text(json.dumps(report, indent=2))
          PYGUARD
      - name: Always preserve exact evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ciphey-native-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ciphey-qualification-setup/
            ${{ runner.temp }}/ciphey-qualification-jwt/
            ${{ runner.temp }}/ciphey-qualification-decimal/
            ${{ runner.temp }}/ciphey-qualification-bundle/
          retention-days: 14
          if-no-files-found: warn
