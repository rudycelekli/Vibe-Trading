{
  "name": "test",
  "on": {
    "push": {
      "branches": [
        "validation/thinkrail-loose-list-baseline-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.4",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun144';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.4',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.4'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Fetch immutable public source and apply regression only",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/thinkrail\"\ncd \"$RUNNER_TEMP/thinkrail\"\ngit init -q\ngit remote add origin https://github.com/JetBrains/thinkrail.git\ngit fetch --depth=1 origin df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\"\npython3 - <<'PYSPEC'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='efa256cf6edb5a816c59c4090706c57d0c5c7bc1a97ffe5551790a55ac9dc9cf'\npathlib.Path('e2e/chat-loose-list-alignment.spec.ts').write_bytes(b)\nPYSPEC\n"
        },
        {
          "name": "Install exact repository dependencies and browser",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\ntest \"$(bun --version)\" = \"1.4.4\"\nbun install --frozen-lockfile\nbun x playwright install --with-deps chromium\n"
        },
        {
          "name": "Require native first-line geometry failure after fixture and screenshot",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/thinkrail\"\nmkdir -p \"$RUNNER_TEMP/thinkrail-proof\"\nset +e\nPLAYWRIGHT_JSON_OUTPUT_FILE=\"$RUNNER_TEMP/thinkrail-proof/baseline.json\" bun run e2e -- --serial e2e/chat-loose-list-alignment.spec.ts --retries=0 --workers=1 --reporter=json > \"$RUNNER_TEMP/thinkrail-proof/baseline.log\" 2>&1\nstatus=$?\nset -e\nexport BASELINE_EXIT=\"$status\"\npython3 - <<'PYORACLE'\nimport json,pathlib,os\nproof=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail-proof'\nx=json.loads((proof/'baseline.json').read_text())\nassert int(os.environ['BASELINE_EXIT'])!=0,'Baseline unexpectedly passed'\nassert not x.get('errors'),x.get('errors')\ntests=[]\ndef walk(s):\n for spec in s.get('specs',[]): tests.extend(spec.get('tests',[]))\n for child in s.get('suites',[]):walk(child)\nfor s in x.get('suites',[]):walk(s)\nassert len(tests)==1,tests\nresults=tests[0]['results'];assert len(results)==1,results\nr=results[0];assert r['status']=='failed',r\nerrors='\\n'.join(e.get('message','') for e in r.get('errors',[]))\nassert 'loose-list-first-line: First numbered step.' in errors,errors\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'thinkrail'\npngs=list((root/'test-results').rglob('loose-list-alignment.png'))\nassert len(pngs)==1,pngs\nassert pngs[0].stat().st_size>1000\ngeometries=list((root/'test-results').rglob('loose-list-geometry.json'))\nassert len(geometries)==1,geometries\ng=json.loads(geometries[0].read_text());assert len(g)==6,g\ntight=[a for a in g if not a['loose']];loose=[a for a in g if a['loose']]\nassert len(tight)==2 and len(loose)==4,g\nassert all(a['lineHeight']>0 and a['textTop']-a['itemTop']<a['lineHeight']/2 for a in tight),g\nassert loose[0]['text']=='First numbered step.' and loose[0]['textTop']-loose[0]['itemTop']>=loose[0]['lineHeight']/2,g\n(proof/'geometry.json').write_text(json.dumps(g,indent=2))\n(proof/'oracle.json').write_text(json.dumps({'result':'BASELINE_REPRODUCED','source':'df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc','failure':'loose-list-first-line geometry after seeded final answer and screenshot','png':str(pngs[0])},indent=2))\nPYORACLE\n\ngit diff --exit-code\ntest \"$(git rev-parse HEAD)\" = df7cb6d2dd5fafbc6ed8eea721f16e54f09e38fc\n"
        },
        {
          "name": "Upload diagnostic proof",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "thinkrail-loose-list-native-baseline",
            "retention-days": 7,
            "path": "${{ runner.temp }}/thinkrail-proof/\n${{ runner.temp }}/thinkrail/test-results/"
          }
        }
      ],
      "if": "${{ github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/thinkrail-loose-list-baseline-20261030' }}"
    }
  }
}
