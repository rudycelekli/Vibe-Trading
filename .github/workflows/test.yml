name: Owned MCP-Go qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mark3labs/mcp-go
          ref: 74945aca910748ee9a9435bf682a4797698ea20b
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
          cache: false
      - name: Provision dependencies before network isolation
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go mod download
          (cd otel && go mod download)
          GOBIN="$RUNNER_TEMP/mcp-tools" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          mkdir -p "$RUNNER_TEMP/mcp-proof"
          echo '' | base64 -d > "$RUNNER_TEMP/mcp-bundle.json"
          echo '' | base64 -d > "$RUNNER_TEMP/mcp-runner.py"
      - name: Native exact-source qualification in empty network namespace
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env -i \
              HOME="$2" PATH="$3" GOPATH="$4" GOCACHE="$5" \
              GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOMAXPROCS=2 CI=true \
              python3 "$6" "$7" "$8" "$9"
          ' -- "$(id -un)" "$HOME" "$RUNNER_TEMP/mcp-tools:$PATH" \
            "$(go env GOPATH)" "$(go env GOCACHE)" \
            "$RUNNER_TEMP/mcp-runner.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mcp-bundle.json" "$RUNNER_TEMP/mcp-proof"
      - name: Require native receipt
        if: always()
        run: test -s "$RUNNER_TEMP/mcp-proof/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-go-native-proof
          path: ${{ runner.temp }}/mcp-proof
          if-no-files-found: error
