{
  "name": "Owned crypto native formatter qualification (not upstream CI)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "paired": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install unchanged native development and exercised optional extras",
          "run": "python -m pip install -e \".[dev,openbb,stats,anthropic]\""
        },
        {
          "name": "crypto native after exact owners and controls",
          "run": "git checkout --detach 2b98f830d2ffc83d677151181a7366f74e918ecb\ntest \"$(git rev-parse HEAD)\" = \"2b98f830d2ffc83d677151181a7366f74e918ecb\"\npython - <<'HASH'\nimport hashlib,pathlib\nassert hashlib.sha256(pathlib.Path('agent/tests/test_equity_crypto_suffix_regressions.py').read_bytes()).hexdigest() == '3e9ca09a87405baf8f44f9ac6a62cc51baa614abe434954e134305a0a511d6b8'\nHASH\nset +e\npython -m pytest agent/tests/test_equity_crypto_suffix_regressions.py --junitxml=result.xml --tb=short -q\nstatus=$?\nset -e\ntest \"$status\" = 0\nKIND=crypto PHASE=after python - <<'EVAL'\n\"\"\"Strict JUnit qualification for isolated, actual native pytest executions.\"\"\"\nimport json\nimport os\nimport xml.etree.ElementTree as ET\n\n\ndef evaluate(root, kind, phase):\n    rows = list(root.iter(\"testcase\"))\n    names = [row.attrib[\"name\"] for row in rows]\n    assert len(names) == len(set(names)), names\n    assert not any(row.find(\"error\") is not None for row in rows)\n    assert not any(row.find(\"skipped\") is not None for row in rows)\n    failures = {row.attrib[\"name\"] for row in rows if row.find(\"failure\") is not None}\n    if kind == \"cache\":\n        expected = {\n            \"test_corrupt_local_cache_metadata_refetches_and_repairs[\" + case + \"]\"\n            for case in (\"null\", \"array\", \"index_names_length\", \"unhashable_index_column\")\n        }\n        controls = {\n            \"test_local_cache_does_not_reuse_another_configured_file\",\n            \"test_identical_local_config_still_hits_the_cache\",\n            \"test_local_cache_separates_queries_on_the_same_database\",\n            \"test_ignored_yaml_metadata_does_not_break_local_fetch[False]\",\n            \"test_ignored_yaml_metadata_does_not_break_local_fetch[True]\",\n        }\n    else:\n        assert kind == \"crypto\"\n        expected = {\n            \"test_explicit_crypto_pairs_stay_crypto[ETH/USD]\",\n            \"test_correlation_slash_crypto_uses_crypto_chain\",\n        } | {\n            \"test_shared_engine_recognizes_known_slash_usd_crypto[\" + pair + \"]\"\n            for pair in (\"BTC/USD\", \"ETH/USD\", \"BNB/USD\", \"SOL/USD\", \"ADA/USD\", \"DOGE/USD\")\n        }\n        controls = {\n            \"test_equity_names_are_not_crypto_quote_suffixes[\" + symbol + \"]\"\n            for symbol in (\"ABNB\", \"ABNB.US\", \"SOL\", \"SOL.US\")\n        } | {\n            \"test_explicit_crypto_pairs_stay_crypto[\" + pair + \"]\"\n            for pair in (\"BTC-USDT\", \"ETHUSDT\", \"ETHBTC\", \"XRPUSDT\", \"LTCETH\", \"AVAXBNB\")\n        } | {\n            \"test_shared_engine_slash_crypto_keeps_fiat_and_equity_controls[\" + pair + \"-\" + market + \"]\"\n            for pair, market in ((\"GBP/USD\", \"forex\"), (\"EUR/USD\", \"forex\"),\n                                 (\"USD/JPY\", \"forex\"), (\"SOL.US\", \"us_equity\"))\n        } | {\"test_airbnb_fetch_uses_equity_chain\"}\n    total = len(expected | controls)\n    assert phase in (\"before\", \"after\")\n    assert len(rows) == total, (len(rows), total)\n    assert failures == (expected if phase == \"before\" else set()), failures\n    assert set(names) == expected | controls, (\"missing or replaced owner/control\", names)\n    for row in rows:\n        failure = row.find(\"failure\")\n        if failure is not None:\n            text = failure.text or \"\"\n            assert \"AssertionError\" in text or (\n                kind == \"cache\" and \"KeyError\" in text and \"AAA.US\" in text\n            ), (row.attrib[\"name\"], text)\n    return {\"kind\": kind, \"phase\": phase, \"tests\": total,\n            \"failures\": sorted(failures), \"passed\": total - len(failures)}\n\n\nif __name__ == \"__main__\":\n    print(json.dumps(evaluate(ET.parse(\"result.xml\").getroot(), os.environ[\"KIND\"],\n                              os.environ[\"PHASE\"]), sort_keys=True))\n\nEVAL\npython - <<'SNAP'\nimport ast, pathlib, subprocess\npath = pathlib.Path('agent/backtest/engines/_market_hooks.py')\nassert path.read_bytes() == subprocess.check_output(['git', 'show', '2b98f830d2ffc83d677151181a7366f74e918ecb:agent/backtest/engines/_market_hooks.py'])\npathlib.Path('/tmp/before-formatter.ast').write_text(ast.dump(ast.parse(path.read_text())))\nSNAP\npython -m black --version\npython -m black agent/backtest/engines/_market_hooks.py\npython - <<'FORMATTED'\nimport ast, base64, hashlib, pathlib\npath = pathlib.Path('agent/backtest/engines/_market_hooks.py')\nassert ast.dump(ast.parse(path.read_text())) == pathlib.Path('/tmp/before-formatter.ast').read_text()\nprint('FORMATTED_SOURCE_SHA256=' + hashlib.sha256(path.read_bytes()).hexdigest())\nprint('FORMATTED_SOURCE_BASE64=' + base64.b64encode(path.read_bytes()).decode())\nassert hashlib.sha256(pathlib.Path('agent/tests/test_equity_crypto_suffix_regressions.py').read_bytes()).hexdigest() == '3e9ca09a87405baf8f44f9ac6a62cc51baa614abe434954e134305a0a511d6b8'\nFORMATTED\npython -m black --check agent/backtest/engines/_market_hooks.py agent/tests/test_equity_crypto_suffix_regressions.py\npython -m ruff check agent/backtest/engines/_market_hooks.py agent/tests/test_equity_crypto_suffix_regressions.py\npython -m pytest agent/tests/test_equity_crypto_suffix_regressions.py --junitxml=result.xml --tb=short -q\nKIND=crypto PHASE=after python - <<'EVAL'\n\"\"\"Strict JUnit qualification for isolated, actual native pytest executions.\"\"\"\nimport json\nimport os\nimport xml.etree.ElementTree as ET\n\n\ndef evaluate(root, kind, phase):\n    rows = list(root.iter(\"testcase\"))\n    names = [row.attrib[\"name\"] for row in rows]\n    assert len(names) == len(set(names)), names\n    assert not any(row.find(\"error\") is not None for row in rows)\n    assert not any(row.find(\"skipped\") is not None for row in rows)\n    failures = {row.attrib[\"name\"] for row in rows if row.find(\"failure\") is not None}\n    if kind == \"cache\":\n        expected = {\n            \"test_corrupt_local_cache_metadata_refetches_and_repairs[\" + case + \"]\"\n            for case in (\"null\", \"array\", \"index_names_length\", \"unhashable_index_column\")\n        }\n        controls = {\n            \"test_local_cache_does_not_reuse_another_configured_file\",\n            \"test_identical_local_config_still_hits_the_cache\",\n            \"test_local_cache_separates_queries_on_the_same_database\",\n            \"test_ignored_yaml_metadata_does_not_break_local_fetch[False]\",\n            \"test_ignored_yaml_metadata_does_not_break_local_fetch[True]\",\n        }\n    else:\n        assert kind == \"crypto\"\n        expected = {\n            \"test_explicit_crypto_pairs_stay_crypto[ETH/USD]\",\n            \"test_correlation_slash_crypto_uses_crypto_chain\",\n        } | {\n            \"test_shared_engine_recognizes_known_slash_usd_crypto[\" + pair + \"]\"\n            for pair in (\"BTC/USD\", \"ETH/USD\", \"BNB/USD\", \"SOL/USD\", \"ADA/USD\", \"DOGE/USD\")\n        }\n        controls = {\n            \"test_equity_names_are_not_crypto_quote_suffixes[\" + symbol + \"]\"\n            for symbol in (\"ABNB\", \"ABNB.US\", \"SOL\", \"SOL.US\")\n        } | {\n            \"test_explicit_crypto_pairs_stay_crypto[\" + pair + \"]\"\n            for pair in (\"BTC-USDT\", \"ETHUSDT\", \"ETHBTC\", \"XRPUSDT\", \"LTCETH\", \"AVAXBNB\")\n        } | {\n            \"test_shared_engine_slash_crypto_keeps_fiat_and_equity_controls[\" + pair + \"-\" + market + \"]\"\n            for pair, market in ((\"GBP/USD\", \"forex\"), (\"EUR/USD\", \"forex\"),\n                                 (\"USD/JPY\", \"forex\"), (\"SOL.US\", \"us_equity\"))\n        } | {\"test_airbnb_fetch_uses_equity_chain\"}\n    total = len(expected | controls)\n    assert phase in (\"before\", \"after\")\n    assert len(rows) == total, (len(rows), total)\n    assert failures == (expected if phase == \"before\" else set()), failures\n    assert set(names) == expected | controls, (\"missing or replaced owner/control\", names)\n    for row in rows:\n        failure = row.find(\"failure\")\n        if failure is not None:\n            text = failure.text or \"\"\n            assert \"AssertionError\" in text or (\n                kind == \"cache\" and \"KeyError\" in text and \"AAA.US\" in text\n            ), (row.attrib[\"name\"], text)\n    return {\"kind\": kind, \"phase\": phase, \"tests\": total,\n            \"failures\": sorted(failures), \"passed\": total - len(failures)}\n\n\nif __name__ == \"__main__\":\n    print(json.dumps(evaluate(ET.parse(\"result.xml\").getroot(), os.environ[\"KIND\"],\n                              os.environ[\"PHASE\"]), sort_keys=True))\n\nEVAL\n"
        }
      ]
    }
  }
}
