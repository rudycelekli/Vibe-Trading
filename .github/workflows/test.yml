name: Vibe engine-aware config qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HKUDS/Vibe-Trading
          ref: fb1851ae1f88943ad9384d132f722e8f9479a027
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install required upstream test extras
        run: pip install -e ".[dev,openbb,stats,anthropic,matrix]"
      - name: Verify optional extras under test
        run: |
          python -c "import nio; from src.channels.matrix import MatrixChannel"
          python -c "import openbb_ai, statsmodels, arch, langchain_anthropic"
      - name: Preserve exact source and baseline harness
        run: |
          python - <<'PREP'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == 'fb1851ae1f88943ad9384d132f722e8f9479a027'
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')[:-1]
          identity = {f: hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files if Path(f).is_file()}
          Path('/tmp/base-identity.json').write_text(json.dumps(identity, sort_keys=True))
          Path('/tmp/evaluate-baseline.py').write_bytes(base64.b64decode(''))
          Path('/tmp/candidate.patch').write_bytes(base64.b64decode(''))
          assert hashlib.sha256(Path('/tmp/candidate.patch').read_bytes()).hexdigest() == 'ea67af9fb6098830fac7c977ee721ab300dbf19bb5b3e1ccf013e7318b5183c8'
          Path('agent/tests/test_backtest_engine_config_warning.py').write_bytes(base64.b64decode(''))
          PREP
      - name: Evaluator positive and negative controls
        run: python /tmp/evaluate-baseline.py
      - name: Native runner and actual fills baseline
        run: |
          set +e
          pytest agent/tests/test_backtest_engine_config_warning.py -k crypto_run_card -q --tb=long --junitxml=/tmp/before.xml > /tmp/before.log 2>&1
          result=$?
          set -e
          cat /tmp/before.log
          test "$result" -ne 0
          python /tmp/evaluate-baseline.py /tmp/before.xml
      - name: Apply frozen candidate and verify full patch
        run: |
          rm agent/tests/test_backtest_engine_config_warning.py
          git diff --exit-code
          git apply --index /tmp/candidate.patch
          test "$(git diff --cached --binary --full-index | sha256sum | cut -d' ' -f1)" = ea67af9fb6098830fac7c977ee721ab300dbf19bb5b3e1ccf013e7318b5183c8
          git diff --check --cached
          test "$(git write-tree)" = a5d04dbfa64e6f127f14b19ae21af95ddab2f5ff
          python - <<'RAW'
          import hashlib,json
          from pathlib import Path
          expected = {'README.md': 'f45b4e5bacb3026d86bf162f8f43aa0f8ceb5a5506c6044bc18b038c57c5394c', 'agent/backtest/runner.py': 'd740527cf00d3e2fb146c8219fb16c44578cfe142a577be1f014c5af7fe7b303', 'agent/tests/test_backtest_engine_config_warning.py': 'c444d024205d4efcf10e8ab03f594c255e00f6471f01bf79aee714878f00adaa'}
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest() == digest for f,digest in expected.items())
          Path('/tmp/candidate-raw-identity.json').write_text(json.dumps(expected,sort_keys=True))
          RAW
      - name: Repository safety and gate tests
        run: |
          bash tools/ci_grep_gates.sh
          pytest tools/test_ci_env_var_gate.py tools/test_ci_private_files_gate.py -q
      - name: Syntax and focused regression
        run: |
          python -m compileall -q agent/cli
          python -m py_compile agent/api_server.py agent/mcp_server.py agent/src/agent/loop.py agent/src/tools/__init__.py agent/backtest/runner.py
          ruff check agent/backtest/runner.py agent/tests/test_backtest_engine_config_warning.py
          pytest agent/tests/test_backtest_engine_config_warning.py agent/tests/test_backtest_unrecognized_config_keys.py -q --junitxml=/tmp/after.xml > /tmp/after.log 2>&1
          cat /tmp/after.log
      - name: Required upstream Python suite
        run: |
          pytest --ignore=agent/tests/e2e_backtest --ignore=agent/tests/test_e2e_harness_v2.py --cov=agent --cov-report=term-missing --cov-report=xml --tb=short -q > /tmp/full-suite.log 2>&1
          tail -35 /tmp/full-suite.log
      - name: Final exact source patch identity
        if: always()
        run: |
          git diff --exit-code
          test "$(git diff --cached --binary --full-index | sha256sum | cut -d' ' -f1)" = ea67af9fb6098830fac7c977ee721ab300dbf19bb5b3e1ccf013e7318b5183c8
          test "$(git write-tree)" = a5d04dbfa64e6f127f14b19ae21af95ddab2f5ff
          python - <<'RAW'
          import hashlib,json
          from pathlib import Path
          expected = json.loads(Path('/tmp/candidate-raw-identity.json').read_text())
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest() == digest for f,digest in expected.items())
          RAW
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vibe1934-native-${{ matrix.python }}
          path: |
            /tmp/candidate-raw-identity.json
            /tmp/base-identity.json
            /tmp/candidate.patch
            /tmp/evaluate-baseline.py
            /tmp/before.log
            /tmp/before.xml
            /tmp/after.log
            /tmp/after.xml
            /tmp/full-suite.log
          if-no-files-found: error
