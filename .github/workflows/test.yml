      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4, verified via GitHub git/ref/tags/v4
        with:
          repository: HKUDS/DeepTutor
          ref: 555b306d6e9e265159d3066ed1b134fad2298914
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # official v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Guard the exact upstream tracked index worktree and untracked source
        run: |
          printf '%s' base > "$RUNNER_TEMP/scrollbar-phase"
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" base
          cmp source/web/package-lock.json "$RUNNER_TEMP/scrollbar-inputs/web__package-lock.json"
          cmp source/web/package.json "$RUNNER_TEMP/scrollbar-inputs/web__package.json"
          mkdir -p "$GITHUB_WORKSPACE/evidence"
      - name: Install locked upstream dependencies and recheck source
        working-directory: source/web
        run: |
          npm ci --legacy-peer-deps
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" base
      - name: Baseline native React suite requires seven passes and the exact regression failure
        working-directory: source
        run: |
          git apply --check "$RUNNER_TEMP/scrollbar-inputs/regression.patch"
          git apply "$RUNNER_TEMP/scrollbar-inputs/regression.patch"
          git add -- web/tests/chat-autoscroll-layout.spec.tsx
          printf '%s' baseline > "$RUNNER_TEMP/scrollbar-phase"
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$PWD" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" baseline
          cd web
          set +e
          npm run test:unit -- tests/chat-autoscroll-layout.spec.tsx --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/baseline.json" > "$GITHUB_WORKSPACE/evidence/baseline.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          node "$RUNNER_TEMP/scrollbar-inputs/assert-native-report.cjs" "$GITHUB_WORKSPACE/evidence/baseline.json" baseline
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" baseline
      - name: Candidate native React suite requires eight passes zero failures zero skips
        working-directory: source
        run: |
          git apply --check "$RUNNER_TEMP/scrollbar-inputs/production.patch"
          git apply "$RUNNER_TEMP/scrollbar-inputs/production.patch"
          git add -- web/hooks/useChatAutoScroll.ts
          printf '%s' candidate > "$RUNNER_TEMP/scrollbar-phase"
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$PWD" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" candidate
          cd web
          npm run test:unit -- tests/chat-autoscroll-layout.spec.tsx --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/candidate.json" > "$GITHUB_WORKSPACE/evidence/candidate.log" 2>&1
          node "$RUNNER_TEMP/scrollbar-inputs/assert-native-report.cjs" "$GITHUB_WORKSPACE/evidence/candidate.json" candidate
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" candidate
      - name: Upstream complete deterministic frontend gate on frozen candidate
        working-directory: source/web
        run: |
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" candidate
          npm run check > "$GITHUB_WORKSPACE/evidence/upstream-check.log" 2>&1
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" candidate
      - name: Install upstream browser toolchain
        working-directory: source/web
        run: npx playwright install --with-deps chromium
      - name: Upstream interaction accessibility and visual matrix audit
        working-directory: source/web
        run: |
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" candidate
          npm start -- --hostname 127.0.0.1 --port 3000 > "$GITHUB_WORKSPACE/evidence/web-audit-server.log" 2>&1 &
          audit_server_pid=$!
          trap 'kill "$audit_server_pid"' EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            if ! kill -0 "$audit_server_pid" 2>/dev/null; then cat "$GITHUB_WORKSPACE/evidence/web-audit-server.log"; exit 1; fi
            sleep 0.1
          done
          WEB_BASE_URL=http://127.0.0.1:3000 npm run audit > "$GITHUB_WORKSPACE/evidence/upstream-browser-audit.log" 2>&1
      - name: Always guard the frozen source postimage even after a failing gate
        if: always()
        run: |
          test -f "$RUNNER_TEMP/scrollbar-phase"
          node "$RUNNER_TEMP/scrollbar-inputs/guard-source.cjs" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/scrollbar-inputs/expected-trees.json" "$(cat "$RUNNER_TEMP/scrollbar-phase")" | tee "$GITHUB_WORKSPACE/evidence/final-source-guard.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        if: always()
        with:
          name: exact-dev-scrollbar-validation
          retention-days: 7
          path: |
            evidence
            source/web/playwright-report
            source/web/test-results
          if-no-files-found: warn
