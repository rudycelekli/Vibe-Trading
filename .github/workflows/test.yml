name: Vibe2051 exact-head review repair qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HKUDS/Vibe-Trading
          ref: 6892d1cb790012694582da704bc76e476d5cf726
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact original PR head
        run: test "$(git rev-parse HEAD)" = 6892d1cb790012694582da704bc76e476d5cf726
      - name: Install upstream CI extras and record exact resolved versions
        run: |
          python -m pip install -e ".[dev,openbb,stats,anthropic,matrix]"
          mkdir -p .qualification
          python -VV | tee .qualification/python.txt
          python -m pip freeze > .qualification/pip-freeze.txt
      - name: Verify upstream CI optional extras
        run: |
          python -c "import nio; from src.channels.matrix import MatrixChannel"
          python -c "import openbb_ai, importlib.metadata as m; print('openbb-ai', m.version('openbb-ai'))"
          python -c "import statsmodels; print('statsmodels', statsmodels.__version__)"
          python -c "import arch; print('arch', arch.__version__)"
          python -c "import langchain_anthropic; print('langchain-anthropic', langchain_anthropic.__version__)"
      - name: Materialize frozen patch and baseline manual controls
        shell: python
        run: |
          import base64, pathlib, hashlib
          p=pathlib.Path(".qualification");p.mkdir(exist_ok=True)
          patch=base64.b64decode("")
          assert hashlib.sha256(patch).hexdigest()=="6ade7067bcd6b05ccd0a53cf3a348f8d937ecac0905712b3c07dc3a43320a21e"
          (p/"repair.patch").write_bytes(patch)
          (p/"scalar_oracle.py").write_bytes(base64.b64decode(""))
          pathlib.Path("agent/tests/factors/test_gtja191_alpha017_power.py").write_bytes(base64.b64decode(""))
      - name: Prove two baseline failures and two unchanged manual controls
        shell: python
        run: |
          import subprocess,xml.etree.ElementTree as ET,json
          args=["python","-m","pytest","agent/tests/factors/test_alpha_library_translations.py::test_every_english_text_has_a_current_chinese_version[notes-notes]","agent/tests/factors/test_gtja191_part1_samples.py::test_gtja191_sample_matches_golden[gtja191_017]","agent/tests/factors/test_gtja191_alpha017_power.py","-q","-ra","--junitxml=.qualification/baseline.xml"]
          result=subprocess.run(args)
          root=ET.parse(".qualification/baseline.xml").getroot()
          cases=list(root.iter("testcase")); failures=[c.attrib["name"] for c in cases if c.find("failure") is not None]
          assert result.returncode==1,("baseline exit",result.returncode)
          assert len(cases)==4 and len(failures)==2,(len(cases),failures)
          assert set(failures)=={"test_every_english_text_has_a_current_chinese_version[notes-notes]","test_gtja191_sample_matches_golden[gtja191_017]"},failures
          assert not list(root.iter("error")) and not list(root.iter("skipped"))
          print(json.dumps({"baseline_cases":4,"failures":failures,"manual_controls_pass":2}))
      - name: Apply exact three-file repair
        run: |
          git checkout -- agent/tests/factors/test_gtja191_alpha017_power.py
          git apply --check .qualification/repair.patch
          git apply .qualification/repair.patch
          python .qualification/scalar_oracle.py | tee .qualification/oracle.json
      - name: Guard candidate source before execution
        shell: python
        run: |
          import subprocess,hashlib,json,pathlib
          expected={'wiki/alpha-library/i18n.zh.json': '1d1f349b2fdf7d3066af9efe198fddee0f5e8feecc21af29f331c79a95f71d33', 'agent/tests/factors/fixtures/goldens/gtja191_017.csv': '89713710648c2d000df50276bded00f387ed542f81e4c4c4ec487a231d5a50a3', 'agent/tests/factors/test_gtja191_alpha017_power.py': 'c17703ad49cc6f918bf8b11ad21fa8bd6ab80582999ab5a930aef1d8218b48ca'}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed==set(expected),(changed,expected)
          for path,sha in expected.items(): assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(["git","diff","--check"],check=True)
          print(json.dumps({"source_guard":"PASS","expected":expected}))
      - name: Upstream repository safety gates
        run: |
          bash tools/ci_grep_gates.sh
          pytest tools/test_ci_env_var_gate.py tools/test_ci_private_files_gate.py -q
      - name: Upstream syntax checks
        run: |
          cd agent
          python -m compileall -q cli
          python -m py_compile api_server.py
          python -m py_compile mcp_server.py
          python -m py_compile src/agent/loop.py
          python -m py_compile src/tools/__init__.py
          python -m py_compile backtest/runner.py
      - name: Required focused factor gates
        run: >-
          pytest agent/tests/factors/test_gtja191_alpha017_power.py
          agent/tests/factors/test_gtja191_part1_samples.py
          agent/tests/factors/test_alpha_library_translations.py
          agent/tests/factors/test_alpha_purity.py
          agent/tests/factors/test_lookahead.py
          -q -ra --junitxml=.qualification/focused.xml
      - name: Full upstream Python CI suite
        run: >-
          pytest --ignore=agent/tests/e2e_backtest
          --ignore=agent/tests/test_e2e_harness_v2.py
          --cov=agent --cov-report=term-missing --cov-report=xml
          --tb=short -q --junitxml=.qualification/full.xml
      - name: Guard candidate source after execution
        if: always()
        shell: python
        run: |
          import subprocess,hashlib,json,pathlib
          expected={'wiki/alpha-library/i18n.zh.json': '1d1f349b2fdf7d3066af9efe198fddee0f5e8feecc21af29f331c79a95f71d33', 'agent/tests/factors/fixtures/goldens/gtja191_017.csv': '89713710648c2d000df50276bded00f387ed542f81e4c4c4ec487a231d5a50a3', 'agent/tests/factors/test_gtja191_alpha017_power.py': 'c17703ad49cc6f918bf8b11ad21fa8bd6ab80582999ab5a930aef1d8218b48ca'}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed==set(expected),(changed,expected)
          for path,sha in expected.items(): assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(["git","diff","--check"],check=True)
          print(json.dumps({"source_guard":"PASS","expected":expected}))
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibe2051-${{ matrix.python-version }}
          path: |
            .qualification/
            coverage.xml
          if-no-files-found: error
