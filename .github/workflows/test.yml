{
  "name": "Controlled CowAgent native ps width qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.11",
            "3.13"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Provision pinned source and dependencies",
          "run": "set -euo pipefail\ngit init \"$RUNNER_TEMP/cow\"\ngit -C \"$RUNNER_TEMP/cow\" remote add origin https://github.com/rudycelekli/CowAgent.git\ngit -C \"$RUNNER_TEMP/cow\" fetch --depth=1 origin f4d1689bf367b34bd0fefa9dbdba34851efffd40\ngit -C \"$RUNNER_TEMP/cow\" checkout --detach FETCH_HEAD\nprintf '%s' '' | base64 --decode > \"$RUNNER_TEMP/candidate.patch\"\necho 'd008da27b7abd034ba3d1d6f6c0884a92fafebdcdac957374d18f933960f6289  '\"$RUNNER_TEMP/candidate.patch\" | sha256sum --check\npython -m pip install pytest ruff -r \"$RUNNER_TEMP/cow/requirements.txt\"\n"
        },
        {
          "name": "Controlled real ps before and candidate proof",
          "working-directory": "${{ runner.temp }}/cow",
          "run": "set -euo pipefail\ngit apply --include=tests/test_browser_profile_identity.py \"$RUNNER_TEMP/candidate.patch\"\nset +e\npython -m pytest tests/test_browser_profile_identity.py tests/test_chrome_singleton_lock.py -q --junitxml=\"$RUNNER_TEMP/before.xml\"\nBEFORE_RC=$?\nset -e\nexport BEFORE_RC\nprintf '%s' '' | base64 --decode > \"$RUNNER_TEMP/assert_before.py\"\npython \"$RUNNER_TEMP/assert_before.py\"\ngit apply --include=agent/tools/browser/chrome_launcher.py \"$RUNNER_TEMP/candidate.patch\"\ngit add agent/tools/browser/chrome_launcher.py tests/test_browser_profile_identity.py\ntest \"$(git write-tree)\" = '2c4c177f8cf831b39d6be14b0db7810841737b6b'\ngit diff --check HEAD\npython -m pytest tests/test_browser_profile_identity.py tests/test_chrome_singleton_lock.py -q\nruff check agent/tools/browser/chrome_launcher.py tests/test_browser_profile_identity.py --select F --ignore F403,F405\n"
        },
        {
          "name": "Complete backend required gate",
          "working-directory": "${{ runner.temp }}/cow",
          "run": "python -m pytest tests/ -q"
        },
        {
          "name": "Final exact tree guard",
          "working-directory": "${{ runner.temp }}/cow",
          "run": "test \"$(git write-tree)\" = '2c4c177f8cf831b39d6be14b0db7810841737b6b'\ntest -z \"$(git diff --name-only)\"\n"
        }
      ]
    }
  }
}
