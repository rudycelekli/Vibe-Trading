          "name": "Fetch immutable public source and install proof driver",
          "run": "set -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nmkdir -p \"$TASK_DIR/evidence\" \"$TASK_DIR/input\"\ncat > \"$TASK_DIR/qualification.py\" <<'PY_QUALIFICATION'\nimport pathlib, subprocess, json, hashlib, base64, sys, os, tempfile, xml.etree.ElementTree as ET\nCFG = {'base': '325afb60108d4ab04e24d715f244bd591ca33fbe', 'tree': 'aa4402ea924b6a3ac02a7ac331485fef6c841e85', 'patch_sha': 'abd916bd670b89168b3a4788105aa1e10406ffe8426284e52f80ae699b63d1d5', 'patch_b64': '', 'file_hashes': {'src/services/prompt-import/readers.ts': '34dab7194346e227dc3200b92fd163204f2531bf237a5e6fdb5dccd6072a7a0d', 'tests/services/prompt-import/gemini-migration.test.ts': 'edca66f52e86cbcf88ab82ade61b80293d96464cfb7dea1643d3391898524d82'}, 'baseline_helper': '5da84d104290ff0f2af8b2ae5510a615d1bf95a3db2037ebb7c4238d51b866c9', 'all_names': ['imports each Gemini prompt once when a resumed JSON session also has a JSONL copy (legacy ids)', 'imports each Gemini prompt once when a resumed JSON session also has a JSONL copy (native ids)', 'keeps distinct Gemini turns and a changed revision rather than deduplicating only by text or id'], 'fail_names': ['imports each Gemini prompt once when a resumed JSON session also has a JSONL copy (legacy ids)', 'imports each Gemini prompt once when a resumed JSON session also has a JSONL copy (native ids)'], 'production_path': 'src/services/prompt-import/readers.ts', 'test_path': 'tests/services/prompt-import/gemini-migration.test.ts', 'consumer_files': ['tests/services/prompt-import/readers.test.ts', 'tests/services/prompt-import/setup-scan.test.ts', 'tests/services/prompt-import/token-usage.test.ts']}\nTASK = pathlib.Path(os.environ['RUNNER_TEMP']) / 'claude-mem-qualification'\nSRC = TASK / 'source'\nEVIDENCE = TASK / 'evidence'\nINPUT = TASK / 'input'\nEVIDENCE.mkdir(parents=True, exist_ok=True)\nINPUT.mkdir(parents=True, exist_ok=True)\nOWNED = set(CFG['file_hashes'])\nGENERATED_PREFIXES = ('plugin/scripts/', 'plugin/sqlite/', 'plugin/ui/')\nGENERATED_FILES = {\n 'plugin/skills/request-progress/scripts/request-groups.mjs',\n 'plugin/package.json','plugin/bun.lock','dsh/package.json',\n '.codex-plugin/plugin.json','plugin/.codex-plugin/plugin.json',\n '.qoder-plugin/plugin.json','plugin/.qoder-plugin/plugin.json',\n '.claude-plugin/plugin.json','plugin/.claude-plugin/plugin.json',\n '.claude-plugin/marketplace.json','.grok-plugin/plugin.json',\n 'openclaw/openclaw.plugin.json',\n 'claude-mem-cursor/.cursor-plugin/plugin.json',\n 'claude-mem-grok-bot/.cursor-plugin/plugin.json',\n 'plugin/skills/how-it-works/onboarding-explainer.md',\n}\ndef sha(p):\n return hashlib.sha256(p.read_bytes()).hexdigest()\ndef call(args, **kwargs):\n return subprocess.run(args, cwd=SRC, check=True, capture_output=True, text=True, **kwargs).stdout.strip()\ndef write(name, value):\n (EVIDENCE/name).write_text(json.dumps(value,indent=2)+'\\n')\ndef generated(name):\n return name in GENERATED_FILES or name.startswith(GENERATED_PREFIXES)\ndef tracked():\n names=call(['git','ls-files','-z']).split('\\0')\n result={}\n for name in names:\n  if not name: continue\n  p=SRC/name\n  result[name]=hashlib.sha256(os.readlink(p).encode()).hexdigest() if p.is_symlink() else sha(p)\n return result\ndef tree():\n with tempfile.TemporaryDirectory(prefix='index-',dir=TASK) as td:\n  env=dict(os.environ,GIT_INDEX_FILE=str(pathlib.Path(td)/'index'))\n  call(['git','read-tree','HEAD'],env=env)\n  call(['git','add','--',*sorted(OWNED)],env=env)\n  return call(['git','write-tree'],env=env)\ndef assert_base():\n assert call(['git','rev-parse','HEAD'])==CFG['base'], 'immutable source HEAD changed'\ndef initialize():\n assert_base()\n assert not call(['git','status','--porcelain','--untracked-files=no']), 'base must be tracked-clean'\n assert not (SRC/'package-lock.json').exists(), 'repo intentionally has no root lockfile'\n assert sha(SRC/'src/services/prompt-import/readers.ts')==CFG['baseline_helper']\n data=base64.b64decode(CFG['patch_b64'],validate=True)\n assert hashlib.sha256(data).hexdigest()==CFG['patch_sha']\n (INPUT/'candidate.patch').write_bytes(data)\n chunks=[b'diff --git '+x for x in data.split(b'diff --git ')[1:]]\n assert len(chunks)==2\n expected={\n  b'diff --git a/src/services/prompt-import/readers.ts b/src/services/prompt-import/readers.ts':'production.patch',\n  b'diff --git a/tests/services/prompt-import/gemini-migration.test.ts b/tests/services/prompt-import/gemini-migration.test.ts':'tests.patch',\n }\n for chunk in chunks:\n  first=chunk.splitlines()[0]\n  assert first in expected, first\n  (INPUT/expected[first]).write_bytes(chunk)\n write('base-tracked.json',tracked())\n write('input-provenance.json',{'base':CFG['base'],'candidate_tree':CFG['tree'],'patch_sha256':CFG['patch_sha'],'patch_parts':{p.name:sha(p) for p in INPUT.glob('*.patch')}})\ndef install_guard():\n assert_base()\n before=json.loads((EVIDENCE/'base-tracked.json').read_text())\n assert tracked()==before, 'dependency installation changed tracked source'\ndef check_junit(path, mode):\n doc=ET.parse(path)\n cases=list(doc.iter('testcase'))\n failures=[c for c in cases if c.find('failure') is not None]\n errors=[c for c in cases if c.find('error') is not None]\n skips=[c for c in cases if c.find('skipped') is not None]\n expected=30 if mode=='consumers' else 3\n assert len(cases)==expected, (len(cases),expected)\n assert not errors and not skips, 'native proof cannot be an error or skip'\n if mode=='before':\n  assert sorted(c.attrib['name'] for c in cases)==CFG['all_names']\n  assert sorted(c.attrib['name'] for c in failures)==CFG['fail_names']\n  assert all(c.find('failure').attrib.get('type')=='AssertionError' for c in failures)\n  assert len(cases)-len(failures)==1\n else:\n  assert not failures\n  if mode=='after': assert sorted(c.attrib['name'] for c in cases)==CFG['all_names']\n result={'mode':mode,'tests':len(cases),'passed':len(cases)-len(failures),'failed_names':[c.attrib['name'] for c in failures],'errors':len(errors),'skipped':len(skips)}\n write('native-'+mode+'-oracle.json',result)\n print(json.dumps(result))\ndef native(mode):\n files=['tests/services/prompt-import/gemini-migration.test.ts']\n if mode=='consumers': files += CFG['consumer_files']\n xml=EVIDENCE/('native-'+mode+'.xml')\n cmd=['bun','test',*files,'--reporter=junit','--reporter-outfile='+str(xml)]\n with (EVIDENCE/('native-'+mode+'.log')).open('w') as log:\n  r=subprocess.run(cmd,cwd=SRC,stdout=log,stderr=subprocess.STDOUT)\n assert r.returncode==(1 if mode=='before' else 0), ('unexpected native exit',mode,r.returncode)\n check_junit(xml,mode)\ndef baseline():\n install_guard()\n call(['git','apply','--check',str(INPUT/'tests.patch')])\n call(['git','apply',str(INPUT/'tests.patch')])\n call(['git','add','-N','--',CFG['test_path']])\n assert sha(SRC/'src/services/prompt-import/readers.ts')==CFG['baseline_helper']\n assert sha(SRC/'tests/services/prompt-import/gemini-migration.test.ts')==CFG['file_hashes']['tests/services/prompt-import/gemini-migration.test.ts']\n assert set(call(['git','diff','--name-only']).splitlines())=={'tests/services/prompt-import/gemini-migration.test.ts'}\n native('before')\ndef apply_candidate(full=False):\n assert_base()\n part='candidate.patch' if full else 'production.patch'\n call(['git','apply','--check',str(INPUT/part)])\n call(['git','apply',str(INPUT/part)])\n call(['git','add','-N','--',CFG['test_path']])\n assert set(call(['git','diff','--name-only']).splitlines())==OWNED\n for name,digest in CFG['file_hashes'].items(): assert sha(SRC/name)==digest,name\n assert tree()==CFG['tree'], 'candidate working tree does not match reviewed tree'\n call(['git','diff','--check'])\n write('candidate-source-guard.json',{'base':CFG['base'],'tree':tree(),'files':CFG['file_hashes'],'patch_sha256':CFG['patch_sha']})\n write('candidate-tracked.json',tracked())\ndef record_resolution():\n install_guard()\n lock=SRC/'package-lock.json'\n assert lock.exists()\n (INPUT/'package-lock.json').write_bytes(lock.read_bytes())\n record={'root_lock_provenance':'resolved once by npm from immutable public base; not a committed repository lock','sha256':sha(lock),'node':call(['node','--version']),'npm':call(['npm','--version']),'bun':call(['bun','--version']),'bun_binary_sha256':sha(pathlib.Path(call(['which','bun'])).resolve()),'package_json_sha256':sha(SRC/'package.json'),'plugin_lock_sha256':sha(SRC/'plugin/bun.lock')}\n (INPUT/'dependency-resolution.json').write_text(json.dumps(record,indent=2)+'\\n')\n write('dependency-resolution.json',record)\n with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('lock_sha='+record['sha256']+'\\n')\ndef use_resolution():\n record=json.loads((INPUT/'dependency-resolution.json').read_text())\n expected=os.environ['EXPECTED_LOCK_SHA']\n assert len(expected)==64 and all(c in '0123456789abcdef' for c in expected)\n assert record['sha256']==expected==sha(INPUT/'package-lock.json')\n assert sha(INPUT/'candidate.patch')==CFG['patch_sha'], 'downloaded patch changed'\n assert record['bun_binary_sha256']==sha(pathlib.Path(call(['which','bun'])).resolve()), 'Bun binary differs across jobs'\n assert record['package_json_sha256']==sha(SRC/'package.json')\n assert record['node']==call(['node','--version']) and record['bun']==call(['bun','--version'])\n (SRC/'package-lock.json').write_bytes((INPUT/'package-lock.json').read_bytes())\n write('downloaded-resolution-verified.json',record)\ndef protected_guard():\n assert_base()\n expected=json.loads((EVIDENCE/'candidate-tracked.json').read_text())\n actual=tracked()\n changes={name:{'before':digest,'after':actual.get(name)} for name,digest in expected.items() if actual.get(name)!=digest}\n forbidden=[name for name in changes if not generated(name)]\n write('generated-build-changes.json',{'generated_changes':changes,'forbidden_source_changes':forbidden,'note':'generated output is evidence only; never staged or published by this workflow'})\n assert not forbidden, forbidden\n for name,digest in CFG['file_hashes'].items(): assert sha(SRC/name)==digest,name\n sizes={}\n for name,budget in [('worker-service.cjs',2900*1024),('mcp-server.cjs',600*1024),('transcript-watcher.cjs',200*1024)]:\n  p=SRC/'plugin/scripts'/name\n  if p.exists(): sizes[name]={'bytes':p.stat().st_size,'sha256':sha(p),'advisory_budget_bytes':budget,'over_advisory':p.stat().st_size>budget}\n write('bundle-observations.json',{'bundles':sizes,'budgets_are_advisory_in_upstream_source':True,'hard_integrity_checks':'npm run build enforces bundle parse, absolute-path, external-Zod and distribution assertions; warnings are not hard size gates'})\n write('final-source-guard.json',{'base':CFG['base'],'reviewed_candidate_tree_before_build':CFG['tree'],'protected_source_unchanged':True})\ndef selftest():\n check_junit(pathlib.Path(sys.argv[2]),sys.argv[3])\nif __name__=='__main__':\n commands={'initialize':initialize,'install-guard':install_guard,'baseline':baseline,'apply-candidate':apply_candidate,'apply-full-candidate':lambda:apply_candidate(True),'native-after':lambda:native('after'),'native-consumers':lambda:native('consumers'),'record-resolution':record_resolution,'use-resolution':use_resolution,'protected-guard':protected_guard,'oracle-selftest':selftest}\n commands[sys.argv[1]]()\nPY_QUALIFICATION\n\ngit init \"$TASK_DIR/source\"\ngit -C \"$TASK_DIR/source\" remote add origin https://github.com/thedotmack/claude-mem.git\ngit -C \"$TASK_DIR/source\" fetch --no-tags --depth=1 origin 325afb60108d4ab04e24d715f244bd591ca33fbe\ngit -C \"$TASK_DIR/source\" checkout --detach FETCH_HEAD\ngit -C \"$TASK_DIR/source\" update-ref refs/remotes/origin/main 325afb60108d4ab04e24d715f244bd591ca33fbe\nset -euo pipefail\nTASK_DIR=\"$RUNNER_TEMP/claude-mem-qualification\"\nSOURCE_DIR=\"$TASK_DIR/source\"\nEVIDENCE_DIR=\"$TASK_DIR/evidence\"\nINPUT_DIR=\"$TASK_DIR/input\"\nTASK_HOME=\"$TASK_DIR/home\"\nexport CLAUDE_CONFIG_DIR=\"$TASK_HOME/.claude\"\nexport CLAUDE_MEM_DATA_DIR=\"$TASK_HOME/.claude-