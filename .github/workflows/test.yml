          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/openbot\"\ngit diff --exit-code\ntest \"$(git write-tree)\" = 5dea812d839c12264f50d0453921df9b19b685cf\nif test -n \"$(git status --porcelain -- server/drizzle)\"; then git status --porcelain -- server/drizzle; exit 1; fi\ngit status --short > \"$RUNNER_TEMP/audit-qualification/final-status.txt\"\nprintf '%s\\n' \"$(git rev-parse HEAD)\" \"$(git write-tree)\" > \"$RUNNER_TEMP/audit-qualification/source-identity.txt\"\n"
        },
        {
          "name": "Upload exact-source qualification receipts",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "openbot-876-static",
            "path": "${{ runner.temp }}/audit-qualification",
            "if-no-files-found": "warn"
          }
        }
      ],
      "if": "${{ github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/openbot-authorization-audit-qualified-20261030' }}",
      "env": {
        "DATABASE_URL": "postgres://openbot:openbot@localhost:5432/openbot_test"
