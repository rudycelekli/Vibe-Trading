name: Vibe2051 exact qualified tree formatter gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HKUDS/Vibe-Trading
          ref: 6892d1cb790012694582da704bc76e476d5cf726
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Materialize frozen repair
        shell: python
        run: |
          import pathlib,base64,hashlib
          p=pathlib.Path("qualification-lint");p.mkdir(exist_ok=True)
          patch=base64.b64decode("")
          assert hashlib.sha256(patch).hexdigest()=="8c228040ddd758c11700cf20094ac414e9542da5f7cbf15df3c3b21690ef2026"
          (p/"repair.patch").write_bytes(patch)
      - name: Apply same qualified source
        run: |
          test "$(git rev-parse HEAD)" = 6892d1cb790012694582da704bc76e476d5cf726
          git apply --check qualification-lint/repair.patch
          git apply qualification-lint/repair.patch
      - name: Guard exact source before tool installation
        shell: python
        run: |
          import subprocess,hashlib,json,pathlib,sys
          expected={'wiki/alpha-library/i18n.zh.json': '1d1f349b2fdf7d3066af9efe198fddee0f5e8feecc21af29f331c79a95f71d33', 'agent/tests/factors/fixtures/goldens/gtja191_017.csv': '89713710648c2d000df50276bded00f387ed542f81e4c4c4ec487a231d5a50a3', 'agent/tests/factors/test_gtja191_alpha017_power.py': 'b8b9ce7efdaecf039e9882b266aea4b38f7e5ba01dd1d0656ceedc4a385905cf'}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed==set(expected),(changed,expected)
          for path,sha in expected.items(): assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(["git","diff","--check"],check=True)
          print(json.dumps({"source_guard":"PASS","expected":expected}))
      - name: Install exact formatter versions from successful native dev freeze
        run: |
          python -m pip install black==26.10.1 ruff==0.17.3
          python -VV | tee qualification-lint/python.txt
          python -m pip freeze > qualification-lint/pip-freeze.txt
      - name: Check original and format only owned copy with AST equality
        shell: python
        run: |
          import ast,hashlib,json,pathlib,subprocess
          proof=pathlib.Path("qualification-lint")
          original=pathlib.Path("agent/tests/factors/test_gtja191_alpha017_power.py")
          original_bytes=original.read_bytes()
          check=subprocess.run(["python","-m","black","--check","--diff","--config","pyproject.toml",str(original)],text=True,capture_output=True)
          (proof/"original-black.log").write_text(check.stdout+check.stderr)
          print(check.stdout+check.stderr)
          assert check.returncode in (0,1),check.returncode
          formatted=proof/"formatted-test_gtja191_alpha017_power.py"
          formatted.write_bytes(original_bytes)
          result=subprocess.run(["python","-m","black","--config","pyproject.toml",str(formatted)],text=True,capture_output=True)
          (proof/"format-owned-copy.log").write_text(result.stdout+result.stderr)
          assert result.returncode==0,result.stderr
          assert ast.dump(ast.parse(original_bytes),include_attributes=False)==ast.dump(ast.parse(formatted.read_bytes()),include_attributes=False)
          assert original.read_bytes()==original_bytes
          subprocess.run(["python","-m","black","--check","--config","pyproject.toml",str(formatted)],check=True)
          ruff=subprocess.run(["python","-m","ruff","check","--config","pyproject.toml","--stdin-filename",str(original),"-"],input=formatted.read_text(),text=True,capture_output=True)
          (proof/"formatted-ruff.log").write_text(ruff.stdout+ruff.stderr)
          print(ruff.stdout+ruff.stderr)
          assert ruff.returncode==0,ruff.returncode
          metadata={"original_black_exit":check.returncode,"original_black_result":"PASS" if check.returncode==0 else "FAIL_REFORMAT_REQUIRED","original_sha256":hashlib.sha256(original_bytes).hexdigest(),"formatted_sha256":hashlib.sha256(formatted.read_bytes()).hexdigest(),"AST_identical":True,"original_source_unchanged":True,"formatted_black_check":"PASS","formatted_ruff_check_with_original_path_and_project_config":"PASS"}
          (proof/"format-receipt.json").write_text(json.dumps(metadata,indent=2))
          print(json.dumps(metadata))
      - name: Guard source remains unchanged by check-only gates
        if: always()
        shell: python
        run: |
          import subprocess,hashlib,json,pathlib,sys
          expected={'wiki/alpha-library/i18n.zh.json': '1d1f349b2fdf7d3066af9efe198fddee0f5e8feecc21af29f331c79a95f71d33', 'agent/tests/factors/fixtures/goldens/gtja191_017.csv': '89713710648c2d000df50276bded00f387ed542f81e4c4c4ec487a231d5a50a3', 'agent/tests/factors/test_gtja191_alpha017_power.py': 'b8b9ce7efdaecf039e9882b266aea4b38f7e5ba01dd1d0656ceedc4a385905cf'}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed==set(expected),(changed,expected)
          for path,sha in expected.items(): assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(["git","diff","--check"],check=True)
          print(json.dumps({"source_guard":"PASS","expected":expected}))
      - name: Upload explicit owned formatter receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibe2051-formatter-gates
          path: qualification-lint/
          if-no-files-found: error
