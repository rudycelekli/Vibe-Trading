name: DeepTutor frozen Stage1 Linux qualification proposal
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deeptutor-stage1
  cancel-in-progress: false
jobs:
  linux-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
        - pr-2065
        - pr-2067
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: HKUDS/DeepTutor
        ref: 555b306d6e9e265159d3066ed1b134fad2298914
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Prepare frozen normal merge
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/evidence"
        test "$(git rev-parse HEAD)" = "555b306d6e9e265159d3066ed1b134fad2298914"
        git config user.name "Codex private validation"
        git config user.email "private-validation@example.invalid"
        case "${{ matrix.case }}" in
          pr-2065)
            git fetch --no-tags origin 3119cf2c5dece05bb3a015c91c09abf855e7b370
            git checkout --detach 3119cf2c5dece05bb3a015c91c09abf855e7b370
            git merge --no-commit --no-ff 555b306d6e9e265159d3066ed1b134fad2298914
            test "$(git write-tree)" = "726b43a7b5a5b6bfe027418262576953808180fc"
            printf '%s\n' '726b43a7b5a5b6bfe027418262576953808180fc' > "$RUNNER_TEMP/expected-tree"
            ;;
          pr-2067)
            git fetch --no-tags origin 1e7bc227b00dbb1c63d00e1a9bd93a32b1300b94
            git checkout --detach 1e7bc227b00dbb1c63d00e1a9bd93a32b1300b94
            git merge --no-commit --no-ff 555b306d6e9e265159d3066ed1b134fad2298914
            test "$(git write-tree)" = "1607bdb2b96d71f9c5a8f9a98ebbbfb40c7a8d0f"
            printf '%s\n' '1607bdb2b96d71f9c5a8f9a98ebbbfb40c7a8d0f' > "$RUNNER_TEMP/expected-tree"
            ;;
        esac
        git commit -m 'Private normal merge for validation only'
        test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/expected-tree")"
        git rev-parse HEAD > "$RUNNER_TEMP/evidence/private-validation-commit.txt"
        git ls-files -s > "$RUNNER_TEMP/source-index.snapshot"
    - name: Verify source and index before execution
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/expected-tree")"
        test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/expected-tree")"
        git ls-files -s > "$RUNNER_TEMP/source-index.current"
        cmp "$RUNNER_TEMP/source-index.snapshot" "$RUNNER_TEMP/source-index.current"
        git diff --exit-code HEAD --
        git diff --cached --exit-code
        if test -n "$(git ls-files --others --exclude-standard)"; then
          git ls-files --others --exclude-standard
          exit 1
        fi
    - name: Install upstream CI groups and pinned lint tooling
      shell: bash
      run: |
        set -euo pipefail
        pip install -r requirements/full.txt -r requirements/partners.txt -r requirements/guard.txt pytest pytest-asyncio pre-commit ruff==0.16.0 import-linter==2.11
        python --version > "$RUNNER_TEMP/evidence/runtime.txt"
        pip freeze > "$RUNNER_TEMP/evidence/packages.txt"
    - name: Create upstream synthetic runtime config
      shell: bash
      run: |
        mkdir -p data/user/settings
        printf 'system:\n  language: en\nlogging:\n  level: WARNING\n' > data/user/settings/main.yaml
        cp tests/fixtures/ci_model_catalog.json data/user/settings/model_catalog.json
    - name: Qualify exact own regression and all five MinerU cases
      shell: bash
      run: |
        python - <<'PYTEST'
        import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
        case='${{ matrix.case }}'
        own=('tests/api/utils/test_http_headers.py',2) if case=='pr-2065' else ('tests/services/storage/test_file_library.py',33)
        for label,path,count in [('own',*own),('mineru','tests/services/parsing/test_mineru_process_lifecycle.py',5)]:
            r=subprocess.run(['python','-m','pytest','-q',path,'--junitxml='+str(out/(label+'.xml'))],capture_output=True,text=True)
            (out/(label+'.log')).write_text(r.stdout+r.stderr)
            print(r.stdout+r.stderr)
            root=ET.parse(out/(label+'.xml')).getroot()
            cases=list(root.iter('testcase'))
            failures=[c.get('name') for c in cases if c.find('failure') is not None]
            errors=[c.get('name') for c in cases if c.find('error') is not None]
            skips=[c.get('name') for c in cases if c.find('skipped') is not None]
            receipt={'returncode':r.returncode,'tests':len(cases),'failures':failures,'errors':errors,'skips':skips}
            (out/(label+'-receipt.json')).write_text(json.dumps(receipt,indent=2))
            assert r.returncode==0 and len(cases)==count and not failures and not errors and not skips, receipt
        PYTEST
    - name: Run required pre-commit and hygiene
      shell: bash
      run: |
        set -euo pipefail
        pre-commit run --all-files
        python scripts/check_repo_hygiene.py
        python scripts/check_workspace_hygiene.py
        git diff --check
    - name: Verify exact source and index after every outcome
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/expected-tree")"
        test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/expected-tree")"
        git ls-files -s > "$RUNNER_TEMP/source-index.current"
        cmp "$RUNNER_TEMP/source-index.snapshot" "$RUNNER_TEMP/source-index.current"
        git diff --exit-code HEAD --
        git diff --cached --exit-code
        if test -n "$(git ls-files --others --exclude-standard)"; then
          git ls-files --others --exclude-standard
          exit 1
        fi
    - name: Preserve exact validation evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: deeptutor-stage1-${{ matrix.case }}
        path: ${{ runner.temp }}/evidence
        retention-days: 7
        if-no-files-found: error
