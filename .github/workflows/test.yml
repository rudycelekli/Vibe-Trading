ts'\n\ndef guard_baseline():\n expected=json.loads((q.EVIDENCE/'candidate-tracked.json').read_text())\n expected['src/utils/context-injection.ts']=q.CFG['baseline_helper']\n actual=q.tracked()\n forbidden=[n for n,d in expected.items() if actual.get(n)!=d and not q.generated(n)]\n q.write('env-control-baseline-source-guard.json',{'base':q.CFG['base'],'baseline_helper_sha256':q.sha(helper),'forbidden_changes':forbidden})\n assert not forbidden,forbidden\n\ndef tests(phase):\n env=os.environ.copy()\n for key in ['CLAUDE_CONFIG_DIR','CLAUDE_MEM_DATA_DIR']:env.pop(key,None)\n xml=q.EVIDENCE/('env-control-'+phase+'.xml')\n command=['bun','test',*FILES,'--test-name-pattern',PATTERN,'--reporter=junit','--reporter-outfile='+str(xml)]\n with (q.EVIDENCE/('env-control-'+phase+'.log')).open('w') as log:\n  result=subprocess.run(command,cwd=q.SRC,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=300)\n assert result.returncode==0,('focused env controls failed',phase,result.returncode)\n cases=list(ET.parse(xml).iter('testcase'))\n # Filtered-out tests may be reported as skipped by Bun. They are never counted as passes.\n executed=[c for c in cases if c.find('skipped') is None]\n assert sorted(c.attrib['name'] for c in executed)==sorted(NAMES),[(c.attrib['name'],list(c)) for c in executed]\n assert not any(c.find('failure') is not None or c.find('error') is not None for c in cases)\n q.write('env-control-'+phase+'-result.json',{'phase':phase,'exact_six_names':NAMES,'passed':len(executed),'filtered_out_skips':len(cases)-len(executed),'env_removed':['CLAUDE_CONFIG_DIR','CLAUDE_MEM_DATA_DIR'],'runner_home_unchanged':True})\n\nphase=sys.argv[1]\nif phase=='baseline':\n original=helper.read_bytes()\n assert q.sha(helper)==q.CFG['file_hashes']['src/utils/context-injection.ts']\n baseline=subprocess.check_output(['git','show',q.CFG['base']+':src/utils/context-injection.ts'],cwd=q.SRC)\n try:\n  helper.write_bytes(baseline)\n  assert q.sha(helper)==q.CFG['baseline_helper']\n  guard_baseline()\n  with (q.EVIDENCE/'env-control-baseline-build.log').open('w') as log:\n   subprocess.run(['npm','run','build'],cwd=q.SRC,check=True,stdout=log,stderr=subprocess.STDOUT,timeout=900)\n  guard_baseline()\n  tests('baseline')\n  guard_baseline()\n finally:\n  helper.write_bytes(original)\n  assert q.sha(helper)==q.CFG['file_hashes']['src/utils/context-injection.ts']\n  q.protected_guard()\nelif phase=='candidate':\n q.protected_guard()\n tests('candidate')\n q.protected_guard()\nelse:raise ValueError(phase)\nPY_ENV_CONTROLS\npython3 \"$TASK_DIR/env_controls.py\" baseline\n"
