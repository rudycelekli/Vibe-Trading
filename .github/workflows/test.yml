name: DeepTutor exact-dev precommit baseline diagnostic proposal
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deeptutor-baseline-precommit
  cancel-in-progress: false
jobs:
  baseline-precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: HKUDS/DeepTutor
        ref: 555b306d6e9e265159d3066ed1b134fad2298914
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.11.17
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.3
    - name: Verify exact base and replicate captured Stage1 main environment
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/evidence"
        test "$(git rev-parse HEAD)" = '555b306d6e9e265159d3066ed1b134fad2298914'
        test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
        git diff --exit-code HEAD --
        git ls-files -s > "$RUNNER_TEMP/evidence/source-index-before.txt"
        git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-head-before.txt"
        git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/source-tree-before.txt"
        printf '%s' '' | base64 --decode > "$RUNNER_TEMP/stage1-packages.txt"
        python - <<'PYSHA'
        from pathlib import Path
        import os,hashlib
        f=Path(os.environ['RUNNER_TEMP'])/'stage1-packages.txt'
        assert hashlib.sha256(f.read_bytes()).hexdigest()=='ae528f12f3c55f9e89f1f99225818b06214cc73da630e450c0e9de5fbfc6ea45'
        PYSHA
        pip install -r "$RUNNER_TEMP/stage1-packages.txt"
        python --version > "$RUNNER_TEMP/evidence/runtime.txt"
        node --version >> "$RUNNER_TEMP/evidence/runtime.txt"
        npm --version >> "$RUNNER_TEMP/evidence/runtime.txt"
        pip freeze > "$RUNNER_TEMP/evidence/packages.txt"
        python - <<'PYVERSIONS'
        import os,pathlib,importlib.metadata as md,json
        from packaging.requirements import Requirement
        p=pathlib.Path(os.environ['RUNNER_TEMP']);receipts={}
        for line in (p/'stage1-packages.txt').read_text().splitlines():
            if not line.strip() or line.startswith('#'):continue
            r=Requirement(line);actual=md.version(r.name)
            assert r.specifier.contains(actual), (r.name,str(r.specifier),actual)
            receipts[r.name]={'required':str(r.specifier),'installed':actual}
        (p/'evidence/main-environment-version-match.json').write_text(json.dumps(receipts,indent=2))
        PYVERSIONS
        mkdir -p data/user/settings
        printf 'system:\n  language: en\nlogging:\n  level: WARNING\n' > data/user/settings/main.yaml
        cp tests/fixtures/ci_model_catalog.json data/user/settings/model_catalog.json
    - name: Audit required pre-commit once and retain real outcome
      shell: bash
      run: |
        python - <<'PYAUDIT'
        import os,pathlib,subprocess,json,hashlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
        r=subprocess.run(['pre-commit','run','--all-files'],capture_output=True,text=True)
        (p/'precommit.stdout.log').write_text(r.stdout)
        (p/'precommit.stderr.log').write_text(r.stderr)
        print(r.stdout+r.stderr)
        receipt={'precommit_returncode':r.returncode,'source_promotion':False}
        for label,args in [('source-head-after',['git','rev-parse','HEAD']),('source-tree-after',['git','rev-parse','HEAD^{tree}']),('source-index-after',['git','ls-files','-s']),('tracked-diff',['git','diff','--binary','HEAD','--']),('tracked-status',['git','status','--porcelain=v1','--untracked-files=all'])]:
            x=subprocess.run(args,capture_output=True,text=True)
            (p/(label+'.txt')).write_text(x.stdout+x.stderr)
            receipt[label+'_returncode']=x.returncode
        receipt['head_unchanged']=(p/'source-head-before.txt').read_text()==(p/'source-head-after.txt').read_text()
        receipt['index_unchanged']=(p/'source-index-before.txt').read_text()==(p/'source-index-after.txt').read_text()
        receipt['tracked_worktree_mutated']=bool((p/'tracked-diff.txt').read_text().strip())
        (p/'precommit-audit-receipt.json').write_text(json.dumps(receipt,indent=2))
        # Capture hook source revisions and isolated environment versions for future
        # exact replay. Stage1 did not retain these transient environment freezes.
        cache=pathlib.Path(os.environ.get('PRE_COMMIT_HOME',str(pathlib.Path.home()/'.cache/pre-commit')))
        for repo in sorted(cache.glob('repo*')):
            if not repo.is_dir():continue
            rev=subprocess.run(['git','rev-parse','HEAD'],cwd=repo,capture_output=True,text=True)
            if rev.returncode==0:(p/('hook-'+repo.name+'-revision.txt')).write_text(rev.stdout)
            for python in repo.glob('py_env-*/bin/python'):
                v=subprocess.run([str(python),'-m','pip','freeze'],capture_output=True,text=True)
                (p/('hook-'+repo.name+'-'+python.parent.parent.name+'-freeze.txt')).write_text(v.stdout+v.stderr)
        assert receipt['head_unchanged'] and receipt['index_unchanged'], receipt
        # Preserve actual pre-commit failure as the job outcome. A diagnostic receipt
        # is never equivalent to passing the repository's required gate.
        raise SystemExit(r.returncode)
        PYAUDIT
    - name: Always preserve source/index/mutation receipts
      if: always()
      shell: bash
      run: |
        python - <<'PYAFTER'
        import os,pathlib,subprocess,json
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence';p.mkdir(exist_ok=True)
        r={}
        for name,cmd in [('head',['git','rev-parse','HEAD']),('tree',['git','rev-parse','HEAD^{tree}']),('index',['git','ls-files','-s']),('worktree-diff',['git','diff','--binary','HEAD','--']),('status',['git','status','--porcelain=v1','--untracked-files=all'])]:
            x=subprocess.run(cmd,capture_output=True,text=True);(p/('always-after-'+name+'.txt')).write_text(x.stdout+x.stderr);r[name+'_returncode']=x.returncode
        (p/'always-after-source-receipt.json').write_text(json.dumps(r,indent=2))
        PYAFTER
    - name: Preserve diagnostic evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: deeptutor-exact-dev-precommit-baseline
        path: ${{ runner.temp }}/evidence
        retention-days: 7
        if-no-files-found: error
