          "run": "set -uo pipefail\ncd \"$RUNNER_TEMP/openbot\"\nset +e\n( set -euo pipefail\ncd server\nbun x drizzle-kit check --config=drizzle.config.ts\n) > \"$RUNNER_TEMP/audit-qualification/migration-check.log\" 2>&1\nresult=$?\ncat \"$RUNNER_TEMP/audit-qualification/migration-check.log\"\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/audit-qualification/migration-check.exit\"\nexit \"$result\"\n"
        },
