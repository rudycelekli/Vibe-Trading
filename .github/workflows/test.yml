{
  "name": "test",
  "on": {
    "push": {
      "branches": [
        "validation/openbot-provider-error-diagnostic-20261030"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "diagnostic": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.3",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun143';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.3',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.3'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nos.symlink('bun',p/'bunx')\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Materialize immutable base and diagnostic only",
          "id": "prepare",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/openbot-883\" \"$RUNNER_TEMP/openbot-883-receipts\"\ncd \"$RUNNER_TEMP/openbot-883\"\ngit init -q\ngit remote add origin https://github.com/CopilotKit/OpenBot.git\ngit fetch --depth=1 origin ab9855c19848378c90a806426130d86699cc798c\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = ab9855c19848378c90a806426130d86699cc798c\ntest \"$(git hash-object server/tests/fixtures/openai-wire/responses-stream.sse)\" = 005646a84b35790868377957bdbe2f617b2e78d4\ntest \"$(bun --version)\" = 1.4.3\nbun install --frozen-lockfile\npython3 - <<'PYFILES'\nimport pathlib,base64,hashlib,os\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='e5e2878bc9354722497c4654247252ba7e168e680a343d542994686a57107755'\npathlib.Path('server/tests/provider-error-probe.test.ts').write_bytes(b)\npathlib.Path(os.environ['RUNNER_TEMP'],'openbot-883-receipts','diagnostic-oracle.py').write_bytes(base64.b64decode(''))\nPYFILES\n"
        },
        {
          "name": "Capture three actual SDK modes and evaluate diagnostic",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/openbot-883\"\nbun run generate:app-config\nset +e\nbun test server/tests/provider-error-probe.test.ts --reporter=junit --reporter-outfile=\"$RUNNER_TEMP/openbot-883-receipts/diagnostic.xml\" > \"$RUNNER_TEMP/openbot-883-receipts/diagnostic.log\" 2>&1\nresult=$?\nset -e\nprintf '%s\\n' \"$result\" > \"$RUNNER_TEMP/openbot-883-receipts/native-exit.txt\"\ncat \"$RUNNER_TEMP/openbot-883-receipts/diagnostic.log\"\npython3 \"$RUNNER_TEMP/openbot-883-receipts/diagnostic-oracle.py\" \"$RUNNER_TEMP/openbot-883-receipts/diagnostic.log\" \"$RUNNER_TEMP/openbot-883-receipts/diagnostic.xml\" \"$RUNNER_TEMP/openbot-883-receipts/verdict.json\"\n"
        },
        {
          "name": "Verify untouched production source and fixture",
          "if": "${{ always() && steps.prepare.outcome == 'success' }}",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/openbot-883\"\ngit diff --exit-code HEAD --\ntest \"$(git hash-object server/tests/fixtures/openai-wire/responses-stream.sse)\" = 005646a84b35790868377957bdbe2f617b2e78d4\ntest \"$(git ls-files --others --exclude-standard)\" = server/tests/provider-error-probe.test.ts\ngit rev-parse HEAD > \"$RUNNER_TEMP/openbot-883-receipts/base.txt\"\ngit status --short > \"$RUNNER_TEMP/openbot-883-receipts/source-status.txt\"\n"
        },
        {
          "name": "Upload diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "openbot-883-native-diagnostic",
            "path": "${{ runner.temp }}/openbot-883-receipts",
            "if-no-files-found": "warn"
          }
        }
      ],
      "if": "${{ github.repository == 'rudycelekli/Vibe-Trading' && github.ref == 'refs/heads/validation/openbot-provider-error-diagnostic-20261030' }}"
    }
  }
}
