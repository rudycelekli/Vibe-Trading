{
  "name": "OpenBot authorization audit baseline only",
  "on": {
    "push": {
      "branches": [
        "validation/openbot-authorization-audit-baseline-20261030"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "baseline": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "services": {
        "postgres": {
          "image": "pgvector/pgvector:pg17",
          "env": {
            "POSTGRES_DB": "openbot_test",
            "POSTGRES_USER": "openbot",
            "POSTGRES_PASSWORD": "openbot"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd \"pg_isready -U openbot -d openbot_test\" --health-interval 5s --health-timeout 5s --health-retries 10"
        }
      },
      "env": {
        "DATABASE_URL": "postgres://openbot:openbot@localhost:5432/openbot_test",
        "TEST_DATABASE_URL": "postgres://openbot:openbot@localhost:5432/openbot_test"
      },
      "steps": [
        {
          "name": "Use pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.19.0"
          }
        },
        {
          "name": "Install verified official Bun1.4.3",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYINSTALL'\nimport urllib.request,json,hashlib,base64,tarfile,io,pathlib,os\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'bun143';p.mkdir()\nm=json.load(urllib.request.urlopen('https://registry.npmjs.org/@oven%2fbun-linux-x64/1.4.3',timeout=30))\nassert m['name']=='@oven/bun-linux-x64' and m['version']=='1.4.3'\nu=m['dist']['tarball'];assert u.startswith('https://registry.npmjs.org/')\nb=urllib.request.urlopen(u,timeout=90).read();assert 'sha512-'+base64.b64encode(hashlib.sha512(b).digest()).decode()==m['dist']['integrity']\nwith tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as t:\n matches=[x for x in t.getmembers() if x.isfile() and x.name.endswith('/bin/bun')];assert len(matches)==1\n (p/'bun').write_bytes(t.extractfile(matches[0]).read());(p/'bun').chmod(0o755)\nwith open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(p)+'\\n')\nPYINSTALL\n"
        },
        {
          "name": "Fetch immutable source, apply maintained regression only and migrate disposable DB",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/openbot\" \"$RUNNER_TEMP/audit-proof\"\ncd \"$RUNNER_TEMP/openbot\"\ngit init -q\ngit remote add origin https://github.com/CopilotKit/OpenBot.git\ngit fetch --depth=1 origin ab9855c19848378c90a806426130d86699cc798c\ngit checkout --detach FETCH_HEAD\ntest \"$(git rev-parse HEAD)\" = \"ab9855c19848378c90a806426130d86699cc798c\"\npython3 - <<'PYPATCH'\nimport base64,hashlib,pathlib\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='3f0fa58c648bc04a38a12607952f5667ca75ed8b71577dfe6a277b4947cdb915'\npathlib.Path('/tmp/authorization-audit-regression.patch').write_bytes(b)\nPYPATCH\ngit apply --check /tmp/authorization-audit-regression.patch\ngit apply /tmp/authorization-audit-regression.patch\ngit diff --check\nbun install --frozen-lockfile\ncd server\nbun scripts/migrate.ts\n"
        },
        {
          "name": "Require three native missing-audit failures and passing terminal-state control",
          "shell": "bash",
          "run": "set -euo pipefail\ncd \"$RUNNER_TEMP/openbot\"\nset +e\nbun test server/tests/arcade-completion-transaction.integration.test.ts -t 'unreconciled audit:' --reporter=junit --reporter-outfile \"$RUNNER_TEMP/audit-proof/baseline.xml\" > \"$RUNNER_TEMP/audit-proof/baseline.log\" 2>&1\nstatus=$?\nset -e\nexport BASELINE_STATUS=\"$status\"\npython3 - <<'PYORACLE'\nimport os,pathlib,xml.etree.ElementTree as ET,json\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-proof'\nroot=ET.parse(p/'baseline.xml').getroot()\nall_cases=list(root.iter('testcase'))\ncases=[x for x in all_cases if 'unreconciled audit:' in x.get('name','')]\nassert len(cases)==4,[(x.get('name'),x.attrib) for x in all_cases]\nexpected=['persists a safe event','two concurrent terminal','an audit insert failure']\nfailed=[x for x in cases if x.find('failure') is not None or x.find('error') is not None]\nassert len(failed)==3,[x.get('name') for x in failed]\nfor name in expected:assert any(name in x.get('name','') for x in failed),name\nassert not any(x.find('skipped') is not None for x in cases)\nassert not any((x.find('failure') is not None or x.find('error') is not None) for x in all_cases if x not in cases)\nassert int(os.environ['BASELINE_STATUS'])!=0\n(p/'oracle-result.json').write_text(json.dumps({'scope':'BASELINE ONLY; not candidate qualification','expected_failures':3,'failed_cases':[x.get('name') for x in failed],'passed_control':'previously settled attempt emits no false event'},indent=2))\nPYORACLE\n# Dependencies and migrations may not change the production source under test.\ngit diff --exit-code -- server/src shared toolkit src 2>/dev/null\ngit diff --check\n"
        },
        {
          "name": "Upload native proof",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "openbot-authorization-audit-baseline",
            "retention-days": 7,
            "path": "${{ runner.temp }}/audit-proof/"
          }
        }
      ]
    }
  }
}
