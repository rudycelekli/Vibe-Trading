{
  "name": "Owned isolated paired native proof (not upstream CI)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "paired": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install unchanged native development and exercised optional extras",
          "run": "python -m pip install -e \".[dev,openbb,stats,anthropic]\""
        },
        {
          "name": "Native before: require exact regression and baseline failure identities",
          "run": "git checkout --detach 695a8ecc9a4c2cefc843557446ec2196dbb28a08\ntest \"$(git rev-parse HEAD)\" = \"695a8ecc9a4c2cefc843557446ec2196dbb28a08\"\ngit show 695a8ecc9a4c2cefc843557446ec2196dbb28a08:agent/tests/test_local_loader_cache_identity.py > /tmp/owned-cache-fixture.py\ncp /tmp/owned-cache-fixture.py agent/tests/test_local_loader_cache_identity.py\npython - <<'HASH'\nimport hashlib,pathlib\nassert hashlib.sha256(pathlib.Path('agent/tests/test_local_loader_cache_identity.py').read_bytes()).hexdigest() == '380f95228e21947bc0bf144c842f9526b53f25275a58e778b5b99db1594f23de'\nHASH\nset +e\npython -m pytest agent/tests/test_alpha_compare_api.py agent/tests/test_local_loader_cache_identity.py \"agent/tests/test_equity_crypto_suffix_regressions.py::test_explicit_crypto_pairs_stay_crypto[ETH/USD]\" agent/tests/test_mcp_alpha_zoo_contract.py::test_alpha_bench_does_not_follow_preexisting_report_symlink --junitxml=result.xml --tb=short -q\nstatus=$?\nset -e\ntest \"$status\" = 1\nPHASE=before python - <<'EVAL'\nimport os, json, xml.etree.ElementTree as ET\nphase = os.environ[\"PHASE\"]\nroot = ET.parse(\"result.xml\").getroot()\nrows = list(root.iter(\"testcase\"))\nerrors = [x.attrib.get(\"name\") for x in rows if x.find(\"error\") is not None]\nskipped = [x.attrib.get(\"name\") for x in rows if x.find(\"skipped\") is not None]\nfailures = [x for x in rows if x.find(\"failure\") is not None]\nexpected = []\nfor case in failures:\n   name = case.attrib[\"name\"]\n   body = case.find(\"failure\").text or \"\"\n   valid = (\n       name.startswith(\"test_corrupt_local_cache_metadata_refetches_and_repairs[\")\n       or name == \"test_explicit_crypto_pairs_stay_crypto[ETH/USD]\"\n       or name == \"test_alpha_bench_does_not_follow_preexisting_report_symlink\"\n       or (phase == \"before\" and name.startswith(\"test_alpha_readiness_uses_effective_token_configuration[synthetic-fixture-token-\"))\n   )\n   assert valid, (name, body)\n   assert \"AssertionError\" in body or \"AttributeError\" in body or \"ValueError\" in body or \"TypeError\" in body, (name, body)\n   expected.append(name)\nassert not errors and not skipped, (errors, skipped)\nassert len(rows) >= 25, len(rows)\nassert len(expected) == (8 if phase == \"before\" else 6), expected\nassert len([x for x in expected if x.startswith(\"test_corrupt_local_cache_metadata_refetches_and_repairs[\")]) == 4\nassert len([x for x in expected if x.startswith(\"test_alpha_readiness_uses_effective_token_configuration[\")]) == (2 if phase == \"before\" else 0)\nprint(json.dumps({\"phase\":phase,\"tests\":len(rows),\"failures\":expected,\"passed\":len(rows)-len(expected),\"skipped\":skipped,\"errors\":errors},sort_keys=True))\nEVAL\n"
        },
        {
          "name": "Native after: require exact regression and baseline failure identities",
          "run": "git checkout --detach 61a012054170add2843b01373f477b4a0adf679f\ntest \"$(git rev-parse HEAD)\" = \"61a012054170add2843b01373f477b4a0adf679f\"\ngit show 695a8ecc9a4c2cefc843557446ec2196dbb28a08:agent/tests/test_local_loader_cache_identity.py > /tmp/owned-cache-fixture.py\ncp /tmp/owned-cache-fixture.py agent/tests/test_local_loader_cache_identity.py\npython - <<'HASH'\nimport hashlib,pathlib\nassert hashlib.sha256(pathlib.Path('agent/tests/test_local_loader_cache_identity.py').read_bytes()).hexdigest() == '380f95228e21947bc0bf144c842f9526b53f25275a58e778b5b99db1594f23de'\nHASH\nset +e\npython -m pytest agent/tests/test_alpha_compare_api.py agent/tests/test_local_loader_cache_identity.py \"agent/tests/test_equity_crypto_suffix_regressions.py::test_explicit_crypto_pairs_stay_crypto[ETH/USD]\" agent/tests/test_mcp_alpha_zoo_contract.py::test_alpha_bench_does_not_follow_preexisting_report_symlink --junitxml=result.xml --tb=short -q\nstatus=$?\nset -e\ntest \"$status\" = 1\nPHASE=after python - <<'EVAL'\nimport os, json, xml.etree.ElementTree as ET\nphase = os.environ[\"PHASE\"]\nroot = ET.parse(\"result.xml\").getroot()\nrows = list(root.iter(\"testcase\"))\nerrors = [x.attrib.get(\"name\") for x in rows if x.find(\"error\") is not None]\nskipped = [x.attrib.get(\"name\") for x in rows if x.find(\"skipped\") is not None]\nfailures = [x for x in rows if x.find(\"failure\") is not None]\nexpected = []\nfor case in failures:\n   name = case.attrib[\"name\"]\n   body = case.find(\"failure\").text or \"\"\n   valid = (\n       name.startswith(\"test_corrupt_local_cache_metadata_refetches_and_repairs[\")\n       or name == \"test_explicit_crypto_pairs_stay_crypto[ETH/USD]\"\n       or name == \"test_alpha_bench_does_not_follow_preexisting_report_symlink\"\n       or (phase == \"before\" and name.startswith(\"test_alpha_readiness_uses_effective_token_configuration[synthetic-fixture-token-\"))\n   )\n   assert valid, (name, body)\n   assert \"AssertionError\" in body or \"AttributeError\" in body or \"ValueError\" in body or \"TypeError\" in body, (name, body)\n   expected.append(name)\nassert not errors and not skipped, (errors, skipped)\nassert len(rows) >= 25, len(rows)\nassert len(expected) == (8 if phase == \"before\" else 6), expected\nassert len([x for x in expected if x.startswith(\"test_corrupt_local_cache_metadata_refetches_and_repairs[\")]) == 4\nassert len([x for x in expected if x.startswith(\"test_alpha_readiness_uses_effective_token_configuration[\")]) == (2 if phase == \"before\" else 0)\nprint(json.dumps({\"phase\":phase,\"tests\":len(rows),\"failures\":expected,\"passed\":len(rows)-len(expected),\"skipped\":skipped,\"errors\":errors},sort_keys=True))\nEVAL\n"
        },
        {
          "name": "Report native formatting gates without changing source",
          "run": "set +e\npython -m black --check agent/src/api/alpha_routes.py agent/tests/test_alpha_compare_api.py\necho \"black_exit=$?\"\npython -m ruff check agent/src/api/alpha_routes.py agent/tests/test_alpha_compare_api.py\necho \"ruff_exit=$?\"\nexit 0"
        }
      ]
    }
  }
}
