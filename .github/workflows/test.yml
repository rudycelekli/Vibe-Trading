name: Private RustScan tag qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rustscan-tags-qualification-20261028
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set shared deadline and fail closed without namespace isolation
        run: |
          set -euo pipefail
          echo "QUALIFICATION_DEADLINE=$(( $(date +%s) + 1050 ))" >> "$GITHUB_ENV"
          command -v sudo
          command -v unshare
          command -v runuser
          sudo unshare --net -- runuser --user "$(id -un)" -- test "$(id -u)" -ne 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: bee-san/RustScan
          ref: 937903340aa6266abb26e93ea3241026b3fd8150
          path: rustscan
          persist-credentials: false
          fetch-depth: 1
      - name: Install upstream stable toolchain and fetch dependencies only
        working-directory: rustscan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rustscan-tags-evidence"
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup run stable rustc -Vv | tee "$RUNNER_TEMP/rustscan-tags-evidence/toolchain.txt"
          rustup run stable cargo fetch --locked 2>&1 | tee "$RUNNER_TEMP/rustscan-tags-evidence/dependencies.log"
      - name: Unpack only exact public source patches and evaluator
        run: |
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,json,os,pathlib
          raw=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='af914b9161ad40ac53c3aabcddded40f3af17f459d08ff5ef1e3c5b5d256d3db'
          files=json.loads(raw)
          assert set(files)=={'baseline.patch','candidate.patch','manifest.json','run-qualification.py','test-evaluator.py'}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rustscan-tags-bundle';out.mkdir()
          for name,text in files.items(): (out/name).write_text(text)
          PYBUNDLE
      - name: Negative evaluator controls
        run: python3 "$RUNNER_TEMP/rustscan-tags-bundle/test-evaluator.py"
      - name: Native before and after and all upstream required gates with no network
        run: python3 "$RUNNER_TEMP/rustscan-tags-bundle/run-qualification.py"
      - name: Always retain exact source and guard evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rustscan-tags-evidence"
          git -C rustscan rev-parse HEAD > "$RUNNER_TEMP/rustscan-tags-evidence/final-head.txt"
          git -C rustscan diff --cached > "$RUNNER_TEMP/rustscan-tags-evidence/final-source.diff"
          git -C rustscan status --porcelain --untracked-files=all > "$RUNNER_TEMP/rustscan-tags-evidence/final-status.txt"
          python3 - <<'PYGUARD'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rustscan-tags-evidence'/'qualification.json'
          assert p.exists(),'Missing qualification receipt; no successful qualification'
          r=json.loads(p.read_text());assert r.get('always_after_source_guard')=='PASS',r
          PYGUARD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rustscan-tags-native-qualification
          path: ${{ runner.temp }}/rustscan-tags-evidence
          if-no-files-found: error
